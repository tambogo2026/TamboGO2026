<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TamboGo · Administración</title>
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #09090b; color: #fafafa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 14px 80px; }
  h1 { font-size: 21px; margin: 0; letter-spacing: -.02em; } h1 span { color: #34d399; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .muted { color: #a1a1aa; font-size: 12px; } .big { font-size: 18px; font-weight: 800; }
  input, select, textarea { width: 100%; padding: 11px 13px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: #fff; font: inherit; font-weight: 600; outline: none; margin-bottom: 8px; }
  select option { background: #18181b; } input:focus, select:focus, textarea:focus { border-color: #10b981; }
  label.f { display: block; font-size: 11px; color: #a1a1aa; font-weight: 600; margin-bottom: 3px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 11px; padding: 9px 14px; cursor: pointer; color: #032a1e; background: linear-gradient(180deg, #34d399, #10b981); }
  button.ghost { background: rgba(255,255,255,.07); color: #fafafa; border: 1px solid rgba(255,255,255,.12); }
  button.bad { background: rgba(244,63,94,.14); color: #fb7185; border: 1px solid rgba(244,63,94,.4); }
  button:disabled { opacity: .5; cursor: wait; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { background: rgba(255,255,255,.06); color: #d4d4d8; border: 1px solid rgba(255,255,255,.1); }
  .tabs button.on { background: rgba(16,185,129,.16); color: #6ee7b7; border-color: rgba(16,185,129,.5); }
  .badge { display: inline-block; min-width: 18px; padding: 1px 6px; margin-left: 5px; border-radius: 999px; font-size: 11px; background: #f43f5e; color: #fff; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(6,182,212,.14); color: #67e8f9; }
  .pill.ok { background: rgba(16,185,129,.14); color: #6ee7b7; } .pill.no { background: rgba(244,63,94,.14); color: #fda4af; } .pill.warn { background: rgba(245,158,11,.15); color: #fcd34d; }
  #login { max-width: 380px; margin: 12vh auto 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .stat { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; letter-spacing: -.02em; } .stat span { font-size: 11px; color: #a1a1aa; }
  .alert { background: rgba(244,63,94,.14); border: 1px solid rgba(244,63,94,.6); border-radius: 14px; padding: 12px; margin-bottom: 10px; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { box-shadow: 0 0 0 4px rgba(244,63,94,.25); } }
  #map { height: 62vh; min-height: 340px; border-radius: 16px; border: 1px solid rgba(255,255,255,.1); background: #09090b; }
  #map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.5); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #18181b; color: #fafafa; }
  .mk { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #052e22; border: 2px solid #10b981; box-shadow: 0 0 12px rgba(16,185,129,.7); }
  .mk.trip { border-color: #06b6d4; box-shadow: 0 0 12px rgba(6,182,212,.7); background: #083344; }
  .mk.sos { border-color: #f43f5e; background: #4c0519; box-shadow: 0 0 16px rgba(244,63,94,.9); animation: blink 1s infinite; }
  .mk.stale { opacity: .45; filter: grayscale(1); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin-top: 8px; font-size: 13px; } .grid2 b { color: #e4e4e7; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" hidden>
    <h1 style="margin-bottom:6px">Tambo<span>Go</span> · Administración</h1>
    <p class="muted" style="margin-bottom:18px">Entra con la cuenta de administrador (la misma con la que te registraste en la app).</p>
    <input id="phone" type="text" autocomplete="username" placeholder="Correo electrónico (o celular si tu cuenta es antigua)">
    <input id="pass" type="password" placeholder="Contraseña">
    <button id="btnLogin" style="width:100%;padding:13px">Ingresar</button>
    <button id="btnForgot" class="ghost" style="width:100%;padding:11px;margin-top:8px">Olvidé mi contraseña</button>
    <p id="loginMsg" class="muted" style="margin-top:12px;color:#fb7185"></p>
  </div>

  <div id="panel" hidden>
    <div class="top"><h1>Tambo<span>Go</span> · Administración</h1><button class="ghost" id="btnOut">Salir</button></div>
    <div id="alerts"></div>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs">
      <button data-tab="map" class="on">Mapa en vivo</button>
      <button data-tab="topups">Recargas<span class="badge" id="bTopups" hidden></span></button>
      <button data-tab="drivers">Conductores<span class="badge" id="bDrivers" hidden></span></button>
      <button data-tab="trips">Viajes</button>
      <button data-tab="settings">Ajustes</button>
    </div>
    <div id="mapBox"><div id="map"></div><p class="muted" style="margin-top:8px">Verde: conductores en línea (gris = sin señal hace más de 2 min). Azul: viajes activos. Se actualiza solo.</p></div>
    <div id="content" hidden></div>
  </div>
</div>

<script>
'use strict';
/* Pega aquí la MISMA configuración de Firebase que usas en index.html */
const FIREBASE_CONFIG = { apiKey: 'AIzaSyDRRgKjdC3t_qJj7DQcsnWjP4N-FK_nz6c', authDomain: 'tambogo-ff986.firebaseapp.com', projectId: 'tambogo-ff986', storageBucket: 'tambogo-ff986.firebasestorage.app', messagingSenderId: '299100259590', appId: '1:299100259590:web:fbd9e2d638518403780a87' };
const EMAIL_BASE = 'tambogo2026@gmail.com'; /* debe ser igual a CONFIG.emailBase de index.html */
const COMMISSION = 300; /* debe coincidir con la comisión de las reglas de Firestore */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => '$' + Math.round(n || 0).toLocaleString('es-CO');
const ms = t => (t && t.toMillis ? t.toMillis() : Date.now());
const when = t => new Date(ms(t)).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const ago = t => { const s = Math.max(0, Math.round((Date.now() - ms(t)) / 1000)); return s < 90 ? s + ' s' : Math.round(s / 60) + ' min'; };

if (!FIREBASE_CONFIG.apiKey) { document.body.innerHTML = '<div class="wrap"><h1>Falta la configuración</h1><p class="muted">Abre admin.html y pega tu FIREBASE_CONFIG.</p></div>'; throw new Error('sin config'); }
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore(), F = firebase.firestore.FieldValue;
auth.languageCode = 'es';
const newEmail = p => { const [u, d] = EMAIL_BASE.split('@'); return `${u}+${p}@${d}`; };
let tab = 'map', settings = {}, started = false, map, layer, ctx = null;
const S = { online: [], trips: [], alerts: [], topups: [], pend: [], today: [] };
const unsubs = [];
const seenAlerts = new Set();

function beep() {
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type = 'square'; o.frequency.value = 660; g.gain.value = .12; o.start(); o.stop(ctx.currentTime + .5); } catch (e) { /* sin audio */ }
}

auth.onAuthStateChanged(async u => {
  if (!u) { stop(); $('#panel').hidden = true; $('#login').hidden = false; return; }
  const me = await db.collection('users').doc(u.uid).get();
  if (!me.exists || me.data().admin !== true) { $('#loginMsg').textContent = 'Esta cuenta no es de administrador.'; await auth.signOut(); return; }
  $('#login').hidden = true; $('#panel').hidden = false; start();
});
$('#btnLogin').onclick = async () => {
  $('#loginMsg').textContent = ''; $('#loginMsg').style.color = '#fb7185'; beep();
  const id = $('#phone').value.trim().toLowerCase(), pw = $('#pass').value;
  try {
    if (id.includes('@')) await auth.signInWithEmailAndPassword(id, pw);
    else { try { await auth.signInWithEmailAndPassword(newEmail(id), pw); } catch (e1) { await auth.signInWithEmailAndPassword(id + '@tambogo.app', pw); } }
  } catch (e) { $('#loginMsg').textContent = 'Correo o contraseña incorrectos.'; }
};
$('#btnForgot').onclick = async () => {
  const id = $('#phone').value.trim().toLowerCase(); $('#loginMsg').style.color = '#fb7185';
  if (!id.includes('@')) { $('#loginMsg').textContent = 'Escribe primero tu correo electrónico arriba.'; return; }
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  try { try { await auth.sendPasswordResetEmail(id, { url: base + 'index.html' }); } catch (e0) { await auth.sendPasswordResetEmail(id); } $('#loginMsg').style.color = '#6ee7b7'; $('#loginMsg').textContent = 'Listo. Revisa tu correo (también en Spam) y abre el enlace.'; }
  catch (e) { $('#loginMsg').textContent = 'No se pudo enviar. Intenta en unos minutos.'; }
};
$('#btnOut').onclick = () => auth.signOut();
$('#tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); show(); };

/* ---------- Escuchas en vivo ---------- */
function stop() { unsubs.splice(0).forEach(f => { try { f(); } catch (e) { /* cerrado */ } }); started = false; }
function listen(q, key, after) { unsubs.push(q.onSnapshot(s => { S[key] = s.docs.map(d => ({ id: d.id, ...d.data() })); after && after(); refresh(); }, e => console.warn(key, e.message))); }
function start() {
  if (started) return; started = true;
  initMap();
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  listen(db.collection('drivers').where('online', '==', true), 'online');
  listen(db.collection('drivers').where('status', '==', 'pending'), 'pend');
  listen(db.collection('trips').where('status', 'in', ['searching', 'accepted', 'arrived', 'in_progress']), 'trips');
  listen(db.collection('topups').where('status', '==', 'pending'), 'topups');
  listen(db.collection('trips').where('completedAt', '>=', firebase.firestore.Timestamp.fromDate(d0)), 'today');
  listen(db.collection('alerts').where('status', '==', 'open'), 'alerts', () => { S.alerts.forEach(a => { if (!seenAlerts.has(a.id)) { seenAlerts.add(a.id); beep(); } }); });
  db.collection('settings').doc('general').get().then(g => { settings = g.exists ? g.data() : {}; }).catch(() => {});
  setInterval(() => { if (started && tab === 'map') paintMap(); }, 15000);
  show();
}
function refresh() {
  paintStats(); paintAlerts();
  const b1 = $('#bTopups'), b2 = $('#bDrivers');
  b1.hidden = !S.topups.length; b1.textContent = S.topups.length; b2.hidden = !S.pend.length; b2.textContent = S.pend.length;
  if (tab === 'map') paintMap(); else if (tab === 'topups' && !busy) show();
}
let busy = false;
function fresh(d) { return Date.now() - ms(d.updatedAt) < 120000; }
function paintStats() {
  const on = S.online.filter(fresh).length, done = S.today.filter(t => t.status === 'completed');
  const vol = done.reduce((a, t) => a + (t.fare || 0), 0);
  $('#stats').innerHTML = [['Conductores en línea', on], ['Viajes activos', S.trips.length], ['Viajes hoy', done.length], ['Movido hoy', fmt(vol)], ['Comisiones hoy', fmt(done.length * COMMISSION)], ['Recargas por acreditar', S.topups.length], ['Conductores por aprobar', S.pend.length]]
    .map(x => `<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
}
function paintAlerts() {
  $('#alerts').innerHTML = S.alerts.map(a => `<div class="alert"><div class="row"><div><b>🚨 EMERGENCIA · ${esc(a.name)}</b> <span class="pill no">${a.role === 'driver' ? 'conductor' : 'pasajero'}</span>
    <div class="muted">${esc(a.phone)} · hace ${ago(a.createdAt)} ${a.tripId ? '· viaje ' + esc(a.tripId.slice(0, 6)) : ''}</div></div>
    <div><a href="tel:${esc(a.phone)}"><button class="ghost">Llamar</button></a> <button class="ghost" data-loc="${a.id}">Ver en mapa</button> <button data-done="${a.id}">Atendida</button></div></div></div>`).join('');
  $('#alerts').querySelectorAll('[data-done]').forEach(b => b.onclick = () => db.collection('alerts').doc(b.dataset.done).update({ status: 'closed', closedAt: F.serverTimestamp() }));
  $('#alerts').querySelectorAll('[data-loc]').forEach(b => b.onclick = () => { const a = S.alerts.find(x => x.id === b.dataset.loc); tab = 'map'; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'map')); show(); if (a && map) map.setView([a.lat, a.lng], 17); });
}

/* ---------- Mapa ---------- */
function initMap() {
  if (map) return;
  map = L.map('map').setView([2.4522, -76.8118], 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  layer = L.layerGroup().addTo(map);
}
const icon = (cls, txt) => L.divIcon({ className: '', html: `<div class="mk ${cls}">${txt}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
function paintMap() {
  if (!map) return; layer.clearLayers(); const pts = [];
  S.online.forEach(d => { if (d.lat == null) return; const st = !fresh(d); pts.push([d.lat, d.lng]);
    L.marker([d.lat, d.lng], { icon: icon('' + (st ? 'stale' : ''), d.vehicleType === 'moto' ? '🏍️' : '🛺') }).addTo(layer).bindPopup(`<b>${esc(d.name)}</b><br>${esc(d.plate)} · ${d.vehicleType === 'moto' ? 'Moto' : 'Tuctuc'}<br>señal hace ${ago(d.updatedAt)}`); });
  S.trips.forEach(t => { if (!t.pickup || !t.dropoff) return;
    L.polyline([[t.pickup.lat, t.pickup.lng], [t.dropoff.lat, t.dropoff.lng]], { color: '#06b6d4', weight: 3, dashArray: '4 8' }).addTo(layer);
    L.circleMarker([t.pickup.lat, t.pickup.lng], { radius: 7, color: '#10b981', fillOpacity: .9 }).addTo(layer).bindPopup(`<b>${esc(t.passengerName)}</b> · ${esc(t.status)}<br>${fmt(t.fare)}<br>${esc(t.pickup.address)} → ${esc(t.dropoff.address)}`);
    L.circleMarker([t.dropoff.lat, t.dropoff.lng], { radius: 6, color: '#f43f5e', fillOpacity: .9 }).addTo(layer);
    if (t.driverPos) L.marker([t.driverPos.lat, t.driverPos.lng], { icon: icon('trip', '➜') }).addTo(layer).bindPopup(`Conductor: ${esc(t.driverInfo && t.driverInfo.name)}`);
    pts.push([t.pickup.lat, t.pickup.lng]); });
  S.alerts.forEach(a => { L.marker([a.lat, a.lng], { icon: icon('sos', '🚨') }).addTo(layer).bindPopup(`<b>EMERGENCIA</b><br>${esc(a.name)} · ${esc(a.phone)}`); pts.push([a.lat, a.lng]); });
  if (pts.length && !map._fitted) { map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 }); map._fitted = true; }
}

/* ---------- Pestañas ---------- */
async function show() {
  const isMap = tab === 'map';
  $('#mapBox').hidden = !isMap; $('#content').hidden = isMap;
  if (isMap) { setTimeout(() => { map.invalidateSize(); paintMap(); }, 50); return; }
  const c = $('#content'); c.innerHTML = '<p class="muted">Cargando…</p>'; busy = true;
  try {
    if (tab === 'topups') await viewTopups(c);
    else if (tab === 'drivers') await viewDrivers(c);
    else if (tab === 'trips') await viewTrips(c);
    else await viewSettings(c);
  } catch (e) { c.innerHTML = '<p class="muted" style="color:#fb7185">Error: ' + esc(e.message) + '</p>'; }
  busy = false;
}

async function viewTopups(c) {
  const all = await db.collection('topups').orderBy('createdAt', 'desc').limit(40).get();
  const pend = all.docs.filter(d => d.data().status === 'pending'), rest = all.docs.filter(d => d.data().status !== 'pending');
  c.innerHTML = '<h2>Por acreditar</h2>' + (pend.length ? pend.map(d => { const v = d.data(); return `<div class="card"><div class="row"><div><div class="big">${fmt(v.amount)}</div><div class="muted">${esc(v.name)} · ${esc(v.phone)} · ${when(v.createdAt)}</div></div>
      <div><button data-ok="${d.id}">Acreditar</button> <button class="bad" data-no="${d.id}">Rechazar</button></div></div>
      <p class="muted" style="margin:8px 0 0">Verifica en tu Nequi que llegó ${fmt(v.amount)} de un pago hecho con el celular ${esc(v.phone)}.</p></div>`; }).join('') : '<div class="card muted">No hay recargas pendientes. 🎉</div>')
    + '<h2>Historial reciente</h2>' + (rest.map(d => { const v = d.data(); return `<div class="card row"><div><b>${fmt(v.amount)}</b> · ${esc(v.name)} <span class="muted">${when(v.createdAt)}</span></div><span class="pill ${v.status === 'approved' ? 'ok' : 'no'}">${v.status === 'approved' ? 'acreditada' : 'rechazada'}</span></div>`; }).join('') || '<div class="card muted">Sin movimientos.</div>');
  c.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => {
    const d = pend.find(x => x.id === b.dataset.ok), v = d.data();
    if (!confirm('¿Ya verificaste el pago en Nequi? Se acreditarán ' + fmt(v.amount) + ' a ' + v.name + '.')) return;
    b.disabled = true; const w = db.collection('wallets').doc(v.driverId), bt = db.batch();
    bt.update(d.ref, { status: 'approved', approvedAt: F.serverTimestamp() });
    bt.update(w, { balance: F.increment(v.amount) });
    bt.set(w.collection('tx').doc(), { type: 'recharge', amount: v.amount, desc: 'Recarga por Nequi', ts: F.serverTimestamp() });
    await bt.commit(); show();
  });
  c.querySelectorAll('[data-no]').forEach(b => b.onclick = async () => { if (!confirm('¿Rechazar esta recarga?')) return; b.disabled = true; await db.collection('topups').doc(b.dataset.no).update({ status: 'rejected' }); show(); });
}

async function viewDrivers(c) {
  const s = await db.collection('drivers').limit(300).get();
  const list = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.status === 'pending' ? -1 : 0) - (b.status === 'pending' ? -1 : 0) || String(a.name).localeCompare(String(b.name)));
  c.innerHTML = `<div class="cols"><input id="q" placeholder="Buscar por nombre o placa"><select id="st"><option value="">Todos los estados</option><option value="pending">Por aprobar</option><option value="approved">Aprobados</option><option value="rejected">Rechazados / suspendidos</option></select></div><div id="list"></div>`;
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase(), st = $('#st').value;
    const rows = list.filter(d => (!st || d.status === st) && (!q || (d.name + ' ' + d.plate).toLowerCase().includes(q)));
    $('#list').innerHTML = rows.map(d => { const r = d.ratingCount ? (d.ratingSum / d.ratingCount).toFixed(1) + ' ★ (' + d.ratingCount + ')' : 'Sin calificaciones';
      return `<div class="card" id="c-${d.id}"><div class="row"><div><div class="big">${esc(d.name)}</div><div class="muted">${d.vehicleType === 'moto' ? 'Moto' : 'Tuctuc'} ${esc(d.plate)} · ${esc(d.brand)} ${esc(d.color)} · ${r}</div></div>
        <div><span class="pill ${d.status === 'approved' ? 'ok' : d.status === 'pending' ? 'warn' : 'no'}">${d.status === 'approved' ? 'aprobado' : d.status === 'pending' ? 'por aprobar' : 'suspendido'}</span></div></div>
        <div style="margin-top:10px"><button class="ghost" data-info="${d.id}">Ver datos y saldo</button>
        ${d.status !== 'approved' ? `<button data-ap="${d.id}">Aprobar</button>` : `<button class="ghost" data-adj="${d.id}">Ajustar saldo</button> <button class="bad" data-sus="${d.id}">Suspender</button>`}
        ${d.status === 'pending' ? `<button class="bad" data-rej="${d.id}">Rechazar</button>` : ''}</div><div id="i-${d.id}"></div></div>`; }).join('') || '<div class="card muted">Sin resultados.</div>';
    const A = (sel, fn) => $('#list').querySelectorAll(sel).forEach(b => b.onclick = () => fn(b, b.dataset[Object.keys(b.dataset)[0]]));
    A('[data-info]', async (b, id) => { b.disabled = true;
      const [p, w] = await Promise.all([db.collection('driverPrivate').doc(id).get(), db.collection('wallets').doc(id).get()]); const v = p.exists ? p.data() : {};
      $('#i-' + id).innerHTML = `<div class="grid2"><span class="muted">Celular</span><b>${esc(v.phone)}</b><span class="muted">Cédula</span><b>${esc(v.cedula)}</b><span class="muted">Licencia</span><b>${esc(v.license)}</b><span class="muted">Nequi</span><b>${esc(v.nequi)}</b><span class="muted">Saldo billetera</span><b>${w.exists ? fmt(w.data().balance) : '—'}</b></div>`; });
    A('[data-ap]', async (b, id) => { const bonus = Number(settings.welcomeBonus != null ? settings.welcomeBonus : 10000);
      if (!confirm('¿Aprobar este conductor' + (bonus ? ' y darle ' + fmt(bonus) + ' de saldo de bienvenida' : '') + '? Verifica antes sus documentos.')) return;
      b.disabled = true; const w = db.collection('wallets').doc(id), bt = db.batch();
      bt.update(db.collection('drivers').doc(id), { status: 'approved' });
      if (bonus > 0) { bt.update(w, { balance: F.increment(bonus) }); bt.set(w.collection('tx').doc(), { type: 'recharge', amount: bonus, desc: 'Saldo de bienvenida', ts: F.serverTimestamp() }); }
      await bt.commit(); show(); });
    A('[data-rej]', async (b, id) => { if (!confirm('¿Rechazar esta solicitud?')) return; b.disabled = true; await db.collection('drivers').doc(id).update({ status: 'rejected', online: false }); show(); });
    A('[data-sus]', async (b, id) => { if (!confirm('¿Suspender a este conductor? Dejará de recibir viajes.')) return; b.disabled = true; await db.collection('drivers').doc(id).update({ status: 'rejected', online: false }); show(); });
    A('[data-adj]', async (b, id) => { const m = Number(prompt('Monto a sumar a la billetera (usa negativo para restar). Ej: 5000 o -2000')); if (!m || isNaN(m)) return;
      const why = prompt('Motivo del ajuste (queda registrado):', 'Ajuste manual'); if (why === null) return;
      const w = db.collection('wallets').doc(id), bt = db.batch(); bt.update(w, { balance: F.increment(m) }); bt.set(w.collection('tx').doc(), { type: 'adjust', amount: m, desc: why || 'Ajuste manual', ts: F.serverTimestamp() });
      await bt.commit(); alert('Saldo ajustado.'); $('#i-' + id).innerHTML = ''; });
  };
  $('#q').oninput = draw; $('#st').onchange = draw; draw();
}

async function viewTrips(c) {
  const s = await db.collection('trips').orderBy('createdAt', 'desc').limit(40).get();
  c.innerHTML = `<div class="row" style="margin-bottom:10px"><select id="fs" style="max-width:220px;margin:0"><option value="">Todos</option><option value="completed">Completados</option><option value="cancelled">Cancelados</option><option value="active">Activos</option></select><button class="bad" id="clean">Limpiar viajes atascados</button></div><div id="tl"></div>`;
  const draw = () => {
    const f = $('#fs').value, rows = s.docs.filter(d => { const st = d.data().status; return !f || (f === 'active' ? ['searching', 'accepted', 'arrived', 'in_progress'].includes(st) : st === f); });
    $('#tl').innerHTML = rows.map(d => { const v = d.data(), act = ['searching', 'accepted', 'arrived', 'in_progress'].includes(v.status), cls = v.status === 'completed' ? 'ok' : v.status === 'cancelled' ? 'no' : 'warn';
      return `<div class="card"><div class="row"><div><b>${esc(v.pickup && v.pickup.address)}</b> → <b>${esc(v.dropoff && v.dropoff.address)}</b>
        <div class="muted">${esc(v.passengerName)} · ${v.driverInfo ? esc(v.driverInfo.name) + ' (' + esc(v.driverInfo.plate) + ')' : 'sin conductor'} · ${when(v.createdAt)} · ${v.payment === 'nequi' ? 'Nequi' : 'Efectivo'}${v.rating ? ' · ' + v.rating + '★' : ''}</div></div>
        <div style="text-align:right"><div class="big">${fmt(v.fare)}</div><span class="pill ${cls}">${esc(v.status)}</span>${act ? ` <button class="bad" data-x="${d.id}">Cancelar</button>` : ''}</div></div></div>`; }).join('') || '<div class="card muted">Sin viajes.</div>';
    $('#tl').querySelectorAll('[data-x]').forEach(b => b.onclick = async () => { if (!confirm('¿Cancelar este viaje?')) return; b.disabled = true; await db.collection('trips').doc(b.dataset.x).update({ status: 'cancelled' }); show(); });
  };
  $('#fs').onchange = draw; draw();
  $('#clean').onclick = async () => {
    const q = await db.collection('trips').where('status', '==', 'searching').get(), old = q.docs.filter(d => Date.now() - ms(d.data().createdAt) > 30 * 60000);
    if (!old.length) { alert('No hay viajes buscando conductor hace más de 30 minutos.'); return; }
    if (!confirm('Se cancelarán ' + old.length + ' viajes que llevan más de 30 minutos buscando conductor.')) return;
    const bt = db.batch(); old.slice(0, 400).forEach(d => bt.update(d.ref, { status: 'cancelled' })); await bt.commit(); show();
  };
}

async function viewSettings(c) {
  const [g, p] = await Promise.all([db.collection('settings').doc('general').get(), db.collection('settings').doc('pricing').get()]);
  const G = g.exists ? g.data() : {}, P = p.exists ? p.data() : {}; settings = G;
  const d = { moto: Object.assign({ base: 2500, perKm: 1000, min: 2500 }, P.moto), tuctuc: Object.assign({ base: 3000, perKm: 1200, min: 3000 }, P.tuctuc) };
  const num = (id, label, v) => `<div><label class="f">${label}</label><input id="${id}" inputmode="numeric" value="${esc(v)}"></div>`;
  c.innerHTML = `<div class="card"><h2 style="margin-top:0">Tarifas sugeridas (COP)</h2><p class="muted">Es la tarifa que la app sugiere. El pasajero siempre puede proponer otro precio.</p>
    <div class="cols"><div><b>Moto</b>${num('mb', 'Tarifa base', d.moto.base)}${num('mk', 'Por kilómetro', d.moto.perKm)}${num('mm', 'Mínima', d.moto.min)}</div>
    <div><b>Tuctuc</b>${num('tb', 'Tarifa base', d.tuctuc.base)}${num('tk', 'Por kilómetro', d.tuctuc.perKm)}${num('tm', 'Mínima', d.tuctuc.min)}</div></div></div>
    <div class="card"><h2 style="margin-top:0">General</h2>
    <label class="f">Tu número de Nequi (donde los conductores pagan las recargas)</label><input id="gn" inputmode="numeric" maxlength="10" value="${esc(G.nequi || '')}">
    <label class="f">WhatsApp de soporte (10 dígitos, sin +57)</label><input id="gw" inputmode="numeric" maxlength="10" value="${esc(G.whatsapp || '')}">
    <label class="f">Saldo de bienvenida al aprobar un conductor (COP)</label><input id="gb" inputmode="numeric" value="${esc(G.welcomeBonus != null ? G.welcomeBonus : 10000)}">
    <label class="f">Aviso para todos los usuarios (opcional, ej: "Hoy hay lluvia, tarifas pueden subir")</label><input id="gm" maxlength="120" value="${esc(G.notice || '')}">
    <label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0 12px"><input type="checkbox" id="go" ${G.serviceOpen === false ? '' : 'checked'} style="width:auto;margin:0"> Servicio abierto (desmárcalo para pausar nuevos pedidos)</label>
    <button id="save">Guardar ajustes</button></div>`;
  $('#save').onclick = async () => {
    const n = id => Number($('#' + id).value) || 0;
    const pricing = { moto: { base: n('mb'), perKm: n('mk'), min: n('mm') }, tuctuc: { base: n('tb'), perKm: n('tk'), min: n('tm') } };
    const nequi = $('#gn').value.trim(), wa = $('#gw').value.trim();
    if ((nequi && !/^3\d{9}$/.test(nequi)) || (wa && !/^3\d{9}$/.test(wa))) { alert('Los números deben tener 10 dígitos y empezar por 3.'); return; }
    const general = { nequi, whatsapp: wa, welcomeBonus: n('gb'), notice: $('#gm').value.trim(), serviceOpen: $('#go').checked };
    await Promise.all([db.collection('settings').doc('pricing').set(pricing), db.collection('settings').doc('general').set(general)]);
    settings = general; alert('Ajustes guardados. Los usuarios los verán al abrir la app de nuevo.');
  };
}
</script>
