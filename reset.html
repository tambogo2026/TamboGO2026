<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="robots" content="noindex,nofollow">
<title>TamboGo · Recuperar contraseña</title>
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(120% 60% at 50% 0%, rgba(16,185,129,.16) 0%, rgba(9,9,11,0) 60%), #09090b; color: #fafafa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; padding: 24px 18px; }
  .card { width: 100%; max-width: 420px; background: rgba(18,18,21,.85); border: 1px solid rgba(255,255,255,.1); border-radius: 28px; padding: 28px 22px; box-shadow: 0 0 40px -10px rgba(16,185,129,.25); text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 20px; margin-bottom: 10px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; } h1 span { color: #34d399; }
  h2 { font-size: 19px; margin: 16px 0 6px; }
  p { color: #a1a1aa; font-size: 14px; line-height: 1.5; margin: 6px 0; }
  b { color: #e4e4e7; }
  label { display: block; text-align: left; font-size: 12px; font-weight: 600; color: #a1a1aa; margin: 14px 0 6px; }
  .field { position: relative; }
  input { width: 100%; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: #fff; font: inherit; font-size: 16px; font-weight: 600; outline: none; transition: all .3s; }
  input:focus { border-color: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,.15); }
  input.err { border-color: #f43f5e; box-shadow: 0 0 0 4px rgba(244,63,94,.15); }
  .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: #a1a1aa; font-size: 12px; font-weight: 700; padding: 8px; cursor: pointer; width: auto; margin: 0; box-shadow: none; }
  button.cta, a.cta { display: block; width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 18px; font: inherit; font-weight: 800; font-size: 15px; color: #032a1e; background: linear-gradient(180deg, #34d399, #10b981); box-shadow: 0 8px 30px -8px rgba(16,185,129,.6); cursor: pointer; text-decoration: none; }
  button.cta:disabled { opacity: .5; }
  .msg { min-height: 20px; margin-top: 10px; font-size: 13px; font-weight: 600; color: #fb7185; }
  .ok { width: 68px; height: 68px; margin: 0 auto; border-radius: 50%; background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.5); display: flex; align-items: center; justify-content: center; font-size: 30px; color: #6ee7b7; }
  .bad { background: rgba(244,63,94,.15); border-color: rgba(244,63,94,.5); color: #fda4af; }
  .spin { width: 34px; height: 34px; margin: 20px auto; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #10b981; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icons/icon-192.png" alt="TamboGo">
  <h1>Tambo<span>Go</span></h1>
  <div id="box"><div class="spin"></div><p>Verificando tu enlace…</p></div>
</div>

<script>
'use strict';
const FIREBASE_CONFIG = { apiKey: 'AIzaSyDRRgKjdC3t_qJj7DQcsnWjP4N-FK_nz6c', authDomain: 'tambogo-ff986.firebaseapp.com', projectId: 'tambogo-ff986', storageBucket: 'tambogo-ff986.firebasestorage.app', messagingSenderId: '299100259590', appId: '1:299100259590:web:fbd9e2d638518403780a87' };
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(); auth.languageCode = 'es';
const box = document.getElementById('box');
const q = new URLSearchParams(location.search), mode = q.get('mode'), code = q.get('oobCode');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fail(title, text) {
  box.innerHTML = `<div class="ok bad" style="margin-top:16px">!</div><h2>${title}</h2><p>${text}</p><a class="cta" href="index.html">Ir a TamboGo</a>`;
}
function success(title, text) {
  box.innerHTML = `<div class="ok" style="margin-top:16px">✓</div><h2>${title}</h2><p>${text}</p><a class="cta" href="index.html">Ir a TamboGo</a>`;
}
function errText(e) {
  const c = e && e.code;
  if (c === 'auth/expired-action-code' || c === 'auth/invalid-action-code') return 'El enlace venció o ya fue usado. Vuelve a la app, pulsa “¿Olvidaste tu contraseña?” y pide uno nuevo.';
  if (c === 'auth/weak-password') return 'La contraseña es muy corta. Usa mínimo 6 caracteres.';
  if (c === 'auth/network-request-failed') return 'Sin conexión. Revisa tu internet e intenta de nuevo.';
  return 'No se pudo completar. Pide un enlace nuevo desde la app.';
}

async function start() {
  if (!code) return fail('Enlace no válido', 'Abre el enlace directamente desde el correo que te enviamos.');
  try {
    if (mode === 'resetPassword') {
      const email = await auth.verifyPasswordResetCode(code);
      box.innerHTML = `<h2>Crea tu contraseña nueva</h2><p>Cuenta: <b>${esc(email)}</b></p>
        <label for="p1">Contraseña nueva</label>
        <div class="field"><input id="p1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"><button class="eye" type="button" data-t="p1">Ver</button></div>
        <label for="p2">Repite la contraseña</label>
        <div class="field"><input id="p2" type="password" autocomplete="new-password" placeholder="Escríbela otra vez"><button class="eye" type="button" data-t="p2">Ver</button></div>
        <div class="msg" id="msg"></div>
        <button class="cta" id="go" style="margin-top:8px">Guardar contraseña</button>`;
      box.querySelectorAll('.eye').forEach(b => b.onclick = () => { const i = document.getElementById(b.dataset.t); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Ocultar' : 'Ver'; });
      document.getElementById('go').onclick = async () => {
        const p1 = document.getElementById('p1'), p2 = document.getElementById('p2'), msg = document.getElementById('msg'), go = document.getElementById('go');
        p1.classList.remove('err'); p2.classList.remove('err'); msg.textContent = '';
        if (p1.value.length < 6) { p1.classList.add('err'); msg.textContent = 'Mínimo 6 caracteres.'; return; }
        if (p1.value !== p2.value) { p2.classList.add('err'); msg.textContent = 'Las contraseñas no son iguales.'; return; }
        go.disabled = true; go.textContent = 'Guardando…';
        try { await auth.confirmPasswordReset(code, p1.value); success('¡Contraseña cambiada!', 'Ya puedes ingresar a TamboGo con tu correo y tu contraseña nueva.'); }
        catch (e) { go.disabled = false; go.textContent = 'Guardar contraseña'; msg.textContent = errText(e); }
      };
    } else if (mode === 'verifyEmail') {
      await auth.applyActionCode(code);
      success('Correo verificado', 'Gracias. Tu correo quedó confirmado en TamboGo.');
    } else {
      fail('Enlace no válido', 'Abre el enlace directamente desde el correo que te enviamos.');
    }
  } catch (e) { fail('No pudimos abrir el enlace', errText(e)); }
}
start();
</script>
</body>
</html>
