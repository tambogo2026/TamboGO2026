<style>
  :root {

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* Sheets */
  .sheet { position: fixed; left: 0; right: 0; bottom: calc(var(--extra, 0px) * -1); margin-inline: auto; width: 100%; max-width: 520px; z-index: 500; border-radius: 30px 30px 0 0; border-bottom: 0; transition: transform .5s var(--spring); display: flex; flex-direction: column; max-height: 82vh; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px + var(--extra, 0px)); box-shadow: 0 -20px 60px -20px rgba(0,0,0,.8); }

  /* Radar */
  .radar { position: relative; width: 190px; height: 190px; margin: 4px auto 10px; border-radius: 50%; }

  .radar .grid::before, .radar .grid::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(16,185,129,.18); }
  .radar .grid::before { inset: 22%; } .radar .grid::after { inset: 44%; }
  .radar .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(16,185,129,.7); opacity: 0; animation: pulse-ring 3s cubic-bezier(.16,1,.3,1) infinite; }
  .radar .ring:nth-child(3) { animation-delay: .75s; } .radar .ring:nth-child(4) { animation-delay: 1.5s; } .radar .ring:nth-child(5) { animation-delay: 2.25s; }

  /* Mapa */
  .leaflet-container { background: #09090b; font-family: inherit; }

  #modal { position: fixed; inset: 0 0 calc(var(--extra, 0px) * -1) 0; z-index: 900; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

<body>
<div id="app">
  <div id="map" style="position:fixed; top:0; left:0; right:0; bottom:calc(var(--extra, 0px) * -1); z-index:0;"></div>
  <div style="position:fixed; inset:0; z-index:1; pointer-events:none; background: linear-gradient(180deg, rgba(9,9,11,.75) 0%, rgba(9,9,11,0) 22%);"></div>

  <header class="fixed top-0 inset-x-0 z-[600] px-4 pointer-events-none" style="padding-top: calc(env(safe-area-inset-top, 0px) + 12px);">
    <div class="mx-auto max-w-[520px] glass rounded-full p-1.5 flex items-center justify-between gap-2 pointer-events-auto glow-em">
      <div class="flex items-center gap-2">
        <button id="hdr-avatar" class="avatar tap !w-9 !h-9 !rounded-full" data-act="openMenu" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
        <span id="hdr-logo" class="flex items-center gap-2"></span>
      </div>
      <div class="role-seg" role="tablist" aria-label="Cambiar de modo">
        <div class="role-pill" id="role-pill"></div>
        <button class="role-btn tap on" data-act="setRole" data-role="passenger" role="tab">Pasajero</button>
        <button class="role-btn tap" data-act="setRole" data-role="driver" role="tab">Conductor</button>
      </div>
    </div>
  </header>

  <button id="locate-btn" class="glass tap" data-act="locate" aria-label="Centrar en mi ubicación"><i class="fa-solid fa-location-crosshairs"></i></button>
  <div id="center-pin" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="notice" hidden></div>
  <div id="offline" hidden><i class="fa-solid fa-wifi-slash"></i> Sin conexión. Revisando…</div>

  <section id="sheet-passenger" class="sheet glass">
    <div class="handle-hit" data-act="toggleSheet" aria-label="Expandir o contraer panel"><div class="handle"></div></div>

}

const Geo = {
  km(a, b) {
    const R = 6371, r = x => x * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  },
  road(a, b) { return this.km(a, b) * 1.35; },
  lerp(a, b, t) { return { lat: a.lat + (b.lat - a.lat) * t, lng: a.lng + (b.lng - a.lng) * t }; },
  etaMin(km) { return Math.max(1, Math.round(km / 0.35)); }
};

const Fare = {
  rates: { moto: { base: 2500, perKm: 1000, min: 2500 }, tuctuc: { base: 3000, perKm: 1200, min: 3000 } },
  suggestFor(v, a, b) { const r = this.rates[v]; return Math.max(r.min, Math.round((r.base + Geo.road(a, b) * r.perKm) / 500) * 500); },
  suggest(v) { const p = AppState.passenger; return this.suggestFor(v || p.selectedVehicle, p.pickup, p.dropoff); }
};

const Geocode = {
  cache: {},
  async reverse(lat, lng) {
    const k = lat.toFixed(4) + ',' + lng.toFixed(4);
    if (this.cache[k]) return this.cache[k];
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=es`);
      if (!r.ok) throw new Error('http');
      const j = await r.json(), a = j.address || {};
      const road = a.road || a.pedestrian || a.footway || a.path;
      const zone = a.neighbourhood || a.suburb || a.quarter || a.hamlet || a.village || a.town || a.city;
      let txt = [road && (a.house_number ? road + ' #' + a.house_number : road), zone].filter(Boolean).join(', ');
      if (!txt) txt = (j.display_name || '').split(',').slice(0, 2).join(',').trim();
      if (!txt) throw new Error('empty');
      this.cache[k] = txt; return txt;
    } catch (e) { return `Punto en el mapa (${lat.toFixed(4)}, ${lng.toFixed(4)})`; }
  },
  async search(q) {
    const base = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=co&accept-language=es&viewbox=-77.4,2.8,-76.4,2.1&q=';
    const run = async qq => { const r = await fetch(base + encodeURIComponent(qq)); if (!r.ok) throw new Error('http'); return r.json(); };
    try {
      let j = await run(q + ', El Tambo, Cauca');
      if (!j.length) j = await run(q);
      return j.map(x => { const p = (x.display_name || '').split(','); return { name: p.slice(0, 2).join(',').trim(), sub: p.slice(2, 4).join(',').trim(), lat: +x.lat, lng: +x.lon }; });
    } catch (e) { return null; }
  }
};

const GPS = {
  watchId: null,
  start() {
    const me = AppState.me;
    if (!navigator.geolocation) { me.status = 'unavailable'; GPS.paint(); return; }
    if (this.watchId !== null) return;
    me.status = 'asking'; this.paint();
    this.watchId = navigator.geolocation.watchPosition(p => this.onFix(p), e => this.onErr(e), { enableHighAccuracy: true, maximumAge: 4000, timeout: 20000 });
  },
  onErr(e) {
    const me = AppState.me;
    if (e.code === 1) {
      me.status = 'denied';
      if (this.watchId !== null) { navigator.geolocation.clearWatch(this.watchId); this.watchId = null; }
      if (AppState.passenger.pickupMode === 'gps') AppState.passenger.pickupMode = 'manual';
      render();
    } else if (me.status !== 'ok') me.status = 'error';
    this.paint();
  },
  onFix(pos) {
    const me = AppState.me, c = pos.coords, first = me.status !== 'ok';
    me.lat = c.latitude; me.lng = c.longitude; me.acc = c.accuracy; me.ts = Date.now(); me.status = 'ok';
    MapView.updateMe();
    const P = AppState.passenger, t = AppState.activeTrip;
    if (Live.on || !(t && t.isRealDriver)) AppState.driverPos = { lat: me.lat, lng: me.lng };
    if (Live.on && t && t.isRealDriver) { t.driverPos = { ...AppState.driverPos }; Live.tickProgress(); }
    let redraw = false;
    if (P.pickupMode === 'gps' && !t) {
      const moved = Geo.km(P.pickup, me) * 1000;
      if (first || moved > 40) {
        P.pickup = { lat: me.lat, lng: me.lng, address: first ? 'Ubicando tu dirección…' : P.pickup.address };
        P.offeredFare = Fare.suggest(); Passenger.refreshPickupAddress(); redraw = true;
      }
    }
    if (first) { if (!Live.on) MapView.relocateAmbient(me); redraw = true; }
    if (redraw) render({ fit: !AppState.ui.pick });
    this.paint();
  },
  paint() {
    document.querySelectorAll('.js-gps').forEach(el => { el.innerHTML = GPS.chip(); });
  },
  chip() {
    const me = AppState.me;
    if (me.status === 'ok') return `<span class="text-emerald-400"><i class="fa-solid fa-satellite-dish mr-1"></i>GPS activo · ±${Math.round(me.acc)} m</span>`;
    if (me.status === 'asking') return `<span class="text-amber-400"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Buscando señal GPS…</span>`;
    if (me.status === 'denied') return `<span class="text-rose-400"><i class="fa-solid fa-location-slash mr-1"></i>Ubicación bloqueada</span>`;
    if (me.status === 'unavailable') return `<span class="text-rose-400">Este dispositivo no tiene GPS</span>`;
    return `<span class="text-zinc-400"><i class="fa-solid fa-location-dot mr-1"></i>GPS apagado</span>`;
  }
};

function toast(msg, type = 'ok') {
  const icons = { ok: 'fa-circle-check', warn: 'fa-triangle-exclamation', danger: 'fa-circle-exclamation', info: 'fa-circle-info' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fa-solid ${icons[type] || icons.ok}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 450); }, 3600);
}

function makeQR(sel, text, size) {
  const el = $(sel); if (!el) return;
  el.innerHTML = '';
  try { new QRCode(el, { text, width: size, height: size, colorDark: '#09090b', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { el.innerHTML = `<img alt="Código QR" width="${size}" height="${size}" src="https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}">`; }
}

const MapView = {
  map: null, dyn: null, amb: null, ambM: [], mover: null, leg: null, meLayer: null,

  icons: {
    origin: () => L.divIcon({ className: '', html: '<div class="mk-origin"><span class="halo"></span><span class="halo h2"></span><span class="dot"></span></div>', iconSize: [44, 44], iconAnchor: [22, 22] }),
    drop: () => L.divIcon({ className: '', html: `<div class="mk-drop">${pinSvg('#fda4af', '#9f1239')}</div><div class="mk-drop-shadow"></div>`, iconSize: [36, 48], iconAnchor: [18, 46] }),
    driver: type => L.divIcon({ className: '', html: `<div class="mk-driver"><span class="orbit"></span><div class="card">${vIcon(type, 22)}</div></div>`, iconSize: [52, 52], iconAnchor: [26, 26] }),
    amb: type => L.divIcon({ className: '', html: `<div class="mk-amb">${vIcon(type, 16)}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }),
    me: () => L.divIcon({ className: '', html: '<div class="mk-me"></div>', iconSize: [20, 20], iconAnchor: [10, 10] })
  },

  init() {
    this.map = L.map('map', { zoomControl: false, attributionControl: true }).setView([2.4522, -76.8118], 16);
    L.tileLayer(CONFIG.tileUrl.replace('{key}', CONFIG.tileKey), { maxZoom: 19, attribution: CONFIG.tileAttribution }).addTo(this.map);
    if (CONFIG.darkTiles) $('#map').classList.add('dark-tiles');
    this.map.attributionControl.setPrefix(false);
    this.dyn = L.layerGroup().addTo(this.map);
    this.meLayer = L.layerGroup().addTo(this.map);
    this.amb = L.layerGroup();
    if (!Live.on) this.relocateAmbient(AppState.passenger.pickup);
    setInterval(() => this.ambM.forEach(m => { const ll = m.getLatLng(); m.setLatLng([ll.lat + rand(-0.0004, 0.0004), ll.lng + rand(-0.0004, 0.0004)]); }), 2500);
    this.map.on('moveend', () => Pick.onMove());
  },

  relocateAmbient(c) {
    this.amb.clearLayers(); this.ambM = [];
    for (let i = 0; i < 5; i++) {
      const m = L.marker([c.lat + rand(-0.006, 0.006), c.lng + rand(-0.006, 0.006)], { icon: this.icons.amb(i % 2 ? 'moto' : 'tuctuc'), interactive: false });
      m.addTo(this.amb); this.ambM.push(m);
    }
  },

  updateMe() {
    const me = AppState.me; if (!this.map || me.status !== 'ok') return;
    this.meLayer.clearLayers();
    L.circle([me.lat, me.lng], { radius: Math.max(me.acc || 20, 10), color: '#38bdf8', weight: 1, opacity: 0.5, fillColor: '#38bdf8', fillOpacity: 0.08, interactive: false }).addTo(this.meLayer);
    const near = Geo.km(me, AppState.passenger.pickup) * 1000 < 25;
    if (AppState.currentRole === 'passenger' && !near) L.marker([me.lat, me.lng], { icon: this.icons.me(), interactive: false }).bindTooltip('Tú', { permanent: true, direction: 'top', offset: [0, -10], className: 'tt' }).addTo(this.meLayer);
  },

  moverInfo() {
    const t = AppState.activeTrip, role = AppState.currentRole;
    if (role === 'passenger' && t && t.isRealPassenger && ['accepted', 'arrived', 'in_progress'].includes(t.status) && t.driverPos) return { pos: t.driverPos, type: t.driver.vehicle };
    if (role === 'driver') return { pos: AppState.driverPos, type: AppState.driver.vehicleType };
    return null;
  },

  moveMover() {
    const mi = this.moverInfo(); if (!mi) return;
    if (this.mover) this.mover.setLatLng([mi.pos.lat, mi.pos.lng]);
    const t = AppState.activeTrip;
    if (this.leg && t) this.leg.setLatLngs([[mi.pos.lat, mi.pos.lng], [t.pickup.lat, t.pickup.lng]]);
  },

  tip(marker, text, dir = 'top', off = [0, -22]) { return marker.bindTooltip(esc(text), { permanent: true, direction: dir, offset: off, className: 'tt' }); },

  sync(fit) {
    if (!this.map) return;
    const role = AppState.currentRole, t = AppState.activeTrip, p = AppState.passenger, d = AppState.driver, pk = AppState.ui.pick;
    this.dyn.clearLayers(); this.mover = null; this.leg = null;
    const pinMode = pk && pk.mode === 'pin' && !t;

    let a = null, b = null;
    if (!pinMode) {
      if (role === 'passenger') { if (t && t.isRealPassenger) { a = t.pickup; b = t.dropoff; } else { a = p.pickup; b = p.dropoff; } }
      else if (t && t.isRealDriver) { a = t.pickup; b = t.dropoff; }
      else if (d.activeRequest) { a = d.activeRequest.pickup; b = d.activeRequest.dropoff; }
    }
    const pts = [];
    if (a && b) {
      const line = [[a.lat, a.lng], [b.lat, b.lng]];
      L.polyline(line, { color: '#10b981', weight: 12, opacity: 0.12, lineCap: 'round' }).addTo(this.dyn);
      L.polyline(line, { color: '#34d399', weight: 3, opacity: 0.95, dashArray: '2 9', lineCap: 'round' }).addTo(this.dyn);
      const o = L.marker([a.lat, a.lng], { icon: this.icons.origin(), interactive: false }).addTo(this.dyn);
      this.tip(o, role === 'driver' ? (t && t.isRealDriver ? t.passengerName : (d.activeRequest ? d.activeRequest.passengerName : 'Pasajero')) : 'Recogida', 'top', [0, -14]);
      const dr = L.marker([b.lat, b.lng], { icon: this.icons.drop(), interactive: false, zIndexOffset: 500 }).addTo(this.dyn);
      this.tip(dr, 'Destino', 'top', [0, -44]);
      pts.push(a, b);
    }
    const mi = this.moverInfo();
    if (mi) {
      const mk = L.marker([mi.pos.lat, mi.pos.lng], { icon: this.icons.driver(mi.type), interactive: false, zIndexOffset: 1000 }).addTo(this.dyn);
      this.tip(mk, role === 'driver' ? 'Tú' : 'Conductor', 'top', [0, -26]);
      this.mover = mk; pts.push(mi.pos);
      if (t && t.status === 'accepted' && a) {
        this.leg = L.polyline([[mi.pos.lat, mi.pos.lng], [a.lat, a.lng]], { color: '#06b6d4', weight: 3, opacity: 0.8, dashArray: '6 8' }).addTo(this.dyn);
      }
    }
    const showAmb = role === 'passenger' && !pinMode && (!t || !t.isRealPassenger || t.status === 'searching');
    if (showAmb) { if (!this.map.hasLayer(this.amb)) this.amb.addTo(this.map); }
    else if (this.map.hasLayer(this.amb)) this.map.removeLayer(this.amb);
    this.updateMe();
    if (fit) this.fit(pts);
  },

  fit(pts) {
    if (!pts.length) { const c = AppState.me.status === 'ok' ? AppState.me : AppState.passenger.pickup; pts = [c]; }
    const sh = $('.sheet:not(.hidden-sheet)');
    const h = sh ? (AppState.ui.collapsed ? 92 : Math.min(sh.offsetHeight, window.innerHeight * 0.82)) : 200;
    if (pts.length === 1) { this.map.setView([pts[0].lat, pts[0].lng], 16, { animate: true }); return; }
    this.map.fitBounds(L.latLngBounds(pts.map(x => [x.lat, x.lng])), { paddingTopLeft: [40, 110], paddingBottomRight: [40, h + 30], maxZoom: 17, animate: true });
  },

  locate() {
    const me = AppState.me;
    if (me.status === 'ok') this.map.setView([me.lat, me.lng], 17, { animate: true });
    else { GPS.start(); toast(me.status === 'denied' ? 'Activa el permiso de ubicación en los ajustes del navegador.' : 'Buscando tu ubicación…', 'info'); }
  }
};

    completed() {

  },

  request(r) {
    const sim = r.source === 'sim';
    const dist = Geo.road(AppState.driverPos, r.pickup), eta = Geo.etaMin(dist);
    let actions;
    if (r.status === 'offered' || r.status === 'negotiating') {
      actions = `<div class="glass-in rounded-2xl p-3 flex items-center gap-3 mt-3"><div class="h-8 w-8 rounded-full shimmer"></div><p class="text-xs text-zinc-300 font-semibold">${r.status === 'negotiating' ? 'Contraoferta enviada. Esperando respuesta…' : 'Oferta enviada. Esperando al pasajero…'}</p></div>`;

        <button class="cta tap mt-3" data-act="reqAccept">Aceptar por ${fmt(r.fare)}</button>
        <div class="grid grid-cols-[1fr_auto] gap-2 mt-2">
          <button class="btn-ghost tap" data-act="reqCounter">Contraofertar ${fmt(r.fare + 500)}</button>

      </div>
      ${sim && r.status === 'new' ? `<div class="h-1 rounded-full bg-zinc-800 overflow-hidden mb-3"><div id="req-bar" class="h-full bg-emerald-500" style="width:${Math.max(0, (r.expiresAt - Date.now()) / 250)}%; transition: width .5s linear"></div></div>` : ''}
      <div class="flex items-center justify-between">
        <div><p class="text-[11px] text-zinc-400">${esc(r.passengerName)} ofrece</p><p class="text-3xl font-extrabold tabular-nums leading-tight">${fmt(r.fare)}</p></div>
        <span class="status-pill ${r.payment === 'nequi' ? 'cy' : 'em'}"><i class="fa-solid ${r.payment === 'nequi' ? 'fa-mobile-screen-button' : 'fa-money-bill-wave'}"></i>${payLabel(r.payment)}</span>
      </div>
      <div class="mt-3 space-y-2 text-xs text-zinc-300">
        <div class="flex items-center gap-2"><span class="dot-em"></span><span class="truncate flex-1">${esc(shortAddr(r.pickup.address))}</span><span class="text-zinc-500 shrink-0">${dist.toFixed(1)} km · ${eta} min</span></div>
        <div class="flex items-center gap-2"><i class="fa-solid fa-location-dot text-rose-500 w-3"></i><span class="truncate flex-1">${esc(shortAddr(r.dropoff.address))}</span><span class="text-zinc-500 shrink-0">${r.distKm.toFixed(1)} km</span></div>
      </div>

  },

  driverTrip(t) {
    const st = t.status;

      const d = AppState.driver, s = t.summary || { commission: 0 };

      <div class="rounded-3xl p-4 border border-emerald-500/40 glow-em bg-emerald-500/[0.05] mb-3 text-center">

    <div class="rounded-3xl p-4 border border-emerald-500/40 glow-em bg-emerald-500/[0.05] mb-3">
      <div class="flex items-center justify-between mb-1">

      <div class="flex items-center gap-2 text-xs text-zinc-300 mb-3">${cobro}</div>
      ${t.passengerPhone ? `<a href="tel:${esc(t.passengerPhone)}" class="btn-ghost tap block mb-2"><i class="fa-solid fa-phone mr-1.5 text-emerald-400"></i>Llamar al pasajero</a>` : ''}
      <a class="btn-ghost tap block mb-3" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${target.lat},${target.lng}"><i class="fa-solid fa-route mr-1.5 text-cyan-400"></i>Abrir navegación en Google Maps</a>
      ${pinBox}
      ${action}
      <button class="btn-danger tap w-full mt-2" data-act="sos"><i class="fa-solid fa-shield-heart mr-1.5"></i>Emergencia</button>
      ${st !== 'in_progress' ? `<button class="btn-danger tap w-full mt-2" data-act="cancel">Cancelar carrera</button>` : ''}
    </div>`;
  },

  driver() {
    const d = AppState.driver, t = AppState.activeTrip, r = d.activeRequest;
    const low = !Driver.canOperate(), mine = t && t.isRealDriver, st = Driver.todayStats();
    const trips = Math.floor(d.walletBalance / d.commissionPerTrip);
    let main = '';
    if (mine) main = Tpl.driverTrip(t);
    else if (!d.isOnline) {
      main = `<div class="text-center py-4"><div class="w-14 h-14 mx-auto rounded-full bg-zinc-800 flex items-center justify-center mb-2"><i class="fa-solid fa-power-off text-zinc-400 text-xl"></i></div>
        <p class="font-bold">Estás desconectado</p><p class="text-xs text-zinc-400 mt-1">Conéctate para recibir solicitudes de pasajeros.</p></div>`;
    } else if (r) main = Tpl.request(r);
    else {
      main = `<div class="text-center py-1"><div class="radar sm"><div class="grid"></div><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><div class="sweep"></div><div class="core">${vIcon(d.vehicleType, 18)}</div></div>

    const toggle = mine ? '' : `<button class="${d.isOnline ? 'btn-danger w-full py-4' : 'cta'} tap ${!d.isOnline && low ? 'off' : ''} mt-2" data-act="toggleOnline">${d.isOnline ? 'Desconectarme' : 'Conectarme'}</button>`;
    const alertLow = low ? `<div class="rounded-2xl p-3 mt-3 border border-rose-500/40 bg-rose-500/10 glow-rose flex gap-3 items-start"><i class="fa-solid fa-lock text-rose-400 mt-0.5"></i>
        <div class="text-xs"><p class="font-bold text-rose-300">Saldo insuficiente</p><p class="text-zinc-300 mt-0.5">Necesitas mínimo ${fmt(d.commissionPerTrip)} para recibir carreras. Recarga tu billetera con Nequi.</p></div></div>` : '';
    const tx = AppState.transactions.slice(0, 3).map(x => `
      <div class="flex items-center justify-between text-xs py-2 border-t border-white/5 first:border-0">
        <div class="min-w-0"><p class="font-semibold truncate">${esc(x.desc)}</p><p class="text-[10px] text-zinc-500">${new Date(x.ts).toLocaleString('es-CO', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })}</p></div>
        <b class="${x.amount > 0 ? 'text-cyan-300' : 'text-rose-400'} tabular-nums">${x.amount > 0 ? '+' : '-'}${fmt(Math.abs(x.amount))}</b></div>`).join('') || `<p class="text-xs text-zinc-500 py-1">Aún no tienes movimientos. Tu primera recarga aparecerá aquí.</p>`;
    return `
    <div class="flex items-center gap-3 mb-3">
      <div class="avatar">${avatarHtml()}</div>
      <div class="flex-1 min-w-0"><p class="font-extrabold truncate">${esc(d.name)}</p><p class="text-[11px] text-zinc-400 flex items-center gap-1.5"><span class="text-emerald-400">${vIcon(d.vehicleType, 14)}</span>${vehLabel(d.vehicleType)} · ${esc(d.plate)}</p></div>
      <span class="text-[11px] js-gps text-right">${GPS.chip()}</span>
    </div>
    ${main}
    ${toggle}
    <div class="glass-in rounded-2xl p-4 mt-3 ${low ? 'border-rose-500/40' : ''}">
      <div class="flex items-start justify-between">
        <div><p class="text-[11px] text-zinc-400">Billetera prepago</p>
          <p class="text-3xl font-extrabold tabular-nums leading-tight ${low ? 'text-rose-400' : ''}">${fmt(d.walletBalance)}</p>
          <p class="text-[11px] text-zinc-500 mt-0.5">Comisión ${fmt(d.commissionPerTrip)} por carrera · te alcanza para ${trips}</p></div>
        <span class="w-10 h-10 rounded-xl flex items-center justify-center ${low ? 'bg-rose-500/15 text-rose-400' : 'bg-cyan-500/15 text-cyan-300'}"><i class="fa-solid fa-wallet"></i></span>
      </div>
      <button class="btn-nequi tap mt-3" data-act="openRecharge"><i class="fa-solid fa-plus mr-1.5"></i>Recargar con Nequi</button>
    </div>
    ${alertLow}
    <div class="grid grid-cols-2 gap-2 mt-3">
      <div class="glass-in rounded-2xl p-3"><p class="text-[11px] text-zinc-400">Ganado hoy</p><p class="text-lg font-extrabold tabular-nums">${fmt(st.total)}</p></div>
      <div class="glass-in rounded-2xl p-3"><p class="text-[11px] text-zinc-400">Carreras hoy</p><p class="text-lg font-extrabold tabular-nums">${st.count}</p></div>
    </div>
    <div class="glass-in rounded-2xl px-4 py-2 mt-3"><p class="text-[11px] text-zinc-400 pt-2 pb-1 font-semibold">Movimientos de billetera</p>${tx}</div>`;
  }
};

/* =====================================================================

const UI = {
  passenger() {
    const body = $('#pass-body'), t = AppState.activeTrip, pk = AppState.ui.pick;
    const real = t && t.isRealPassenger;
    const view = t ? (real ? t.status : 'busy') : (pk ? 'pick-' + pk.mode : 'idle');
    if (view === 'searching' && body.dataset.view === 'searching') {
      $('#offers-list').innerHTML = Tpl.offers();
      const f = $('#search-fare'); if (f) f.textContent = fmt(t.fare);
      return;
    }
    if (view === 'pick-search' && body.dataset.view === 'pick-search') { const r = $('#pick-results'); if (r) r.innerHTML = Tpl.results(); return; }
    const keep = body.dataset.view === view ? body.scrollTop : 0;
    body.dataset.view = view;
    const tpl = ['accepted', 'arrived', 'in_progress'].includes(view) ? Tpl.passenger.ride : Tpl.passenger[view];
    body.innerHTML = tpl();
    body.scrollTop = keep;
  },
  driver() { const b = $('#drv-body'), k = b.scrollTop; b.innerHTML = Tpl.driver(); b.scrollTop = k; },
  progress(k) {
    Trip.k = k;
    const t = AppState.activeTrip;
    document.querySelectorAll('.js-bar').forEach(b => { b.style.width = (k * 100) + '%'; });
    document.querySelectorAll('.js-eta').forEach(e => { e.textContent = Math.max(0, Math.ceil(Trip.etaTotal * (1 - k))); });
    if (t && t.driverPos) {
      const target = t.status === 'in_progress' ? t.dropoff : t.pickup;
      document.querySelectorAll('.js-dist').forEach(e => { e.textContent = Geo.km(t.driverPos, target).toFixed(1) + ' km'; });
    }
  },
  modal() {
    const m = $('#modal'), panel = $('#modal-panel'), u = AppState.ui, d = AppState.driver;
    if (!u.recharge) { m.classList.remove('open'); return; }
    const wasOpen = m.classList.contains('open');
    m.classList.add('open');
    let inner = '';
    if (u.rechargeState === 'select') {
      inner = `
        <div class="handle mb-4"></div>
        <div class="flex items-center justify-between mb-1"><h2 class="text-xl font-extrabold tracking-tight">Recargar billetera</h2>
          <button class="w-9 h-9 rounded-full bg-white/5 tap" data-act="closeRecharge" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button></div>
        <p class="text-xs text-zinc-400 mb-4">Elige el monto, paga por Nequi y confirma.</p>
        <div class="grid grid-cols-4 gap-2 mb-4">${[5000, 10000, 20000, 50000].map(a => `<button class="chip cy tap justify-center ${u.rechargeAmount === a ? 'on' : ''}" data-act="amt" data-a="${a}">${fmt(a)}</button>`).join('')}</div>
        <div class="glass-in rounded-3xl p-4 text-center glow-cy">
          <p class="text-[11px] text-cyan-300 font-bold mb-2">Envía a la cuenta Nequi de TamboGo</p>
          <div id="nq-box" class="mx-auto w-[190px] h-[190px] rounded-2xl bg-white p-3"></div>
          <p class="text-2xl font-extrabold tracking-wide mt-3 tabular-nums">${fmtPhone(CONFIG.nequiPlataforma)}</p>
          <button class="text-xs text-cyan-300 font-semibold mt-1 tap" data-act="copyNequi"><i class="fa-regular fa-copy mr-1"></i>Copiar número</button>
        </div>
        <div class="text-xs text-zinc-400 mt-3 space-y-1">
          <p>1. Envía <b class="text-zinc-100">${fmt(u.rechargeAmount)}</b> por Nequi y escribe tu celular <b class="text-zinc-100">${esc(d.phone)}</b> en el mensaje.</p>
          <p>2. Toca “Ya envié el pago” para acreditar tu saldo.</p>
          <p class="text-zinc-500">${Live.on ? 'Verificamos tu pago en la cuenta de TamboGo y acreditamos el saldo, normalmente en pocos minutos.' : 'Demo: la confirmación es simulada.'}</p>
        </div>
        <button class="cta tap mt-4" data-act="confirmRecharge">Ya envié el pago</button>`;
    } else if (u.rechargeState === 'verifying') {
      inner = `<div class="handle mb-4"></div><h2 class="text-xl font-extrabold tracking-tight mb-1">Verificando pago</h2>
        <p class="text-xs text-zinc-400 mb-5">Estamos confirmando tu transferencia de ${fmt(u.rechargeAmount)}.</p>
        <div class="space-y-3"><div class="h-16 rounded-2xl shimmer"></div><div class="h-4 w-2/3 rounded shimmer"></div><div class="h-4 w-1/2 rounded shimmer"></div></div>`;
    } else if (u.rechargeState === 'pending') {
      inner = `<div class="handle mb-4"></div><div class="text-center py-3"><div class="check-pop w-16 h-16 mx-auto rounded-full bg-cyan-500/15 border border-cyan-500/50 flex items-center justify-center text-cyan-300 text-2xl mb-3 glow-cy"><i class="fa-solid fa-clock"></i></div><h2 class="text-xl font-extrabold tracking-tight">Solicitud recibida</h2><p class="text-sm text-zinc-400 mt-2 max-w-[320px] mx-auto">Estamos verificando tu pago de ${fmt(u.rechargeAmount)}. Cuando lo confirmemos, tu saldo se acredita solo y te avisamos aquí.</p></div><button class="cta tap mt-3" data-act="closeRecharge">Entendido</button>`;
    } else {
      inner = `<div class="handle mb-4"></div><div class="text-center py-3">
          <div class="check-pop w-16 h-16 mx-auto rounded-full bg-cyan-500/15 border border-cyan-500/50 flex items-center justify-center text-cyan-300 text-2xl mb-3 glow-cy"><i class="fa-solid fa-check"></i></div>
          <h2 class="text-xl font-extrabold tracking-tight">Recarga acreditada</h2><p class="text-xs text-zinc-400 mt-1">Tu nuevo saldo es</p>
          <p class="text-4xl font-extrabold tabular-nums mt-1">${fmt(d.walletBalance)}</p></div>
        <button class="cta tap mt-3" data-act="closeRecharge">Listo</button>`;
    }
    panel.innerHTML = inner;
    panel.style.animation = wasOpen ? 'none' : '';
    if (u.rechargeState === 'select') makeQR('#nq-box', CONFIG.nequiPlataforma, 160);
  }
};

function render(opts = {}) {
  const role = AppState.currentRole, pk = AppState.ui.pick, t = AppState.activeTrip;
  $('#role-pill').style.transform = role === 'passenger' ? 'translateX(0)' : 'translateX(100%)';
  document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('on', b.dataset.role === role));
  $('#hdr-avatar').innerHTML = avatarHtml();
  const sp = $('#sheet-passenger'), sd = $('#sheet-driver');
  sp.classList.toggle('hidden-sheet', role !== 'passenger');
  sd.classList.toggle('hidden-sheet', role !== 'driver');
  [sp, sd].forEach(s => s.classList.toggle('collapsed', AppState.ui.collapsed));
  const pinMode = !!(pk && pk.mode === 'pin' && !t && role === 'passenger');
  const cp = $('#center-pin');
  if (cp.hidden === pinMode) { cp.hidden = !pinMode; }
  if (pinMode) cp.innerHTML = pinSvg(pk.field === 'pickup' ? '#6ee7b7' : '#fda4af', pk.field === 'pickup' ? '#047857' : '#9f1239');
  if (role === 'passenger') UI.passenger(); else UI.driver();
  UI.modal();
  requestAnimationFrame(() => MapView.sync(!!opts.fit));
  Awake.sync();
}

/* =====================================================================
   SELECTOR DE DIRECCIONES (buscador, GPS y pin en el mapa)
   ===================================================================== */
const Pick = {
  t: null, geoT: null,
  open(field) {
    if (AppState.activeTrip) return;
    AppState.ui.pick = { field, mode: 'search', q: '', remote: null, loading: false, error: false, items: [], tmp: null };
    AppState.ui.collapsed = false; render();
    setTimeout(() => { const i = $('#pick-q'); if (i) i.focus(); }, 350);
  },
  close() { AppState.ui.pick = null; render({ fit: true }); },
  onInput(v) {
    const pk = AppState.ui.pick; if (!pk) return;
    pk.q = v; pk.remote = null; pk.error = false; clearTimeout(this.t);
    const q = v.trim();
    if (q.length < 3) { pk.loading = false; this.paint(); return; }

    this.t = setTimeout(async () => {
      const r = await Geocode.search(q);
      const cur = AppState.ui.pick;
      if (cur && cur.q.trim() === q) { cur.remote = r || []; cur.error = !r; cur.loading = false; Pick.paint(); }
    }, 650);
  },
  paint() { const el = $('#pick-results'); if (el) el.innerHTML = Tpl.results(); },
  list() {
    const pk = AppState.ui.pick, q = norm(pk.q.trim()), items = [];
    if (!q) {
      const seen = new Set();
      AppState.history.forEach(h => {
        if (pk.field === 'dropoff' && h.toPos && !seen.has(h.to) && seen.size < 3) { seen.add(h.to); items.push({ group: 'Recientes', name: shortAddr(h.to), sub: '', lat: h.toPos.lat, lng: h.toPos.lng, full: h.to, icon: 'fa-clock-rotate-left' }); }

    PLACES.filter(p => !q || norm(p.name).includes(q)).forEach(p => items.push({ group: 'Lugares populares', name: p.short, sub: p.name, lat: p.lat, lng: p.lng, full: p.name, icon: 'fa-location-dot' }));
    (pk.remote || []).forEach(r => items.push({ group: 'Resultados', name: r.name, sub: r.sub, lat: r.lat, lng: r.lng, full: r.name, icon: 'fa-map-pin' }));
    return items;
  },
  choose(i) { const it = (AppState.ui.pick.items || [])[i]; if (it) this.apply(AppState.ui.pick.field, { lat: it.lat, lng: it.lng, address: it.full }); },
  apply(field, loc) {

    else p.dropoff = { lat: loc.lat, lng: loc.lng, address: loc.address };

  },
  useGps() {

    p.pickupMode = 'gps'; p.pickup = { lat: me.lat, lng: me.lng, address: 'Ubicando tu dirección…' };
    p.offeredFare = Fare.suggest(); AppState.ui.pick = null; Passenger.refreshPickupAddress(); render({ fit: true });
  },
  pin() {
    const pk = AppState.ui.pick, p = AppState.passenger;

    pk.mode = 'pin'; pk.tmp = { lat: base.lat, lng: base.lng, address: base.address };

    clearTimeout(this.geoT);
    this.geoT = setTimeout(async () => {
      const addr = await Geocode.reverse(c.lat, c.lng);
      const cur = AppState.ui.pick;
      if (cur && cur.mode === 'pin' && cur.tmp && cur.tmp.lat === c.lat) { cur.tmp.address = addr; const e2 = $('#pin-addr'); if (e2) e2.textContent = addr; }

};

/* =====================================================================
   VIAJE (máquina de estados compartida)
   ===================================================================== */
const Trip = {
  raf: null, k: 0, etaTotal: 1,
  setStatus(s) {
    const t = AppState.activeTrip; if (!t) return;
    t.status = s;
    if (t.isRealPassenger) AppState.passenger.tripStatus = s;
    AppState.ui.collapsed = false; render({ fit: true }); Store.save();
  },
  driveTo(target, ms, done, etaMin) {
    const t = AppState.activeTrip; if (!t) return;
    cancelAnimationFrame(this.raf);
    this.etaTotal = etaMin || 1; this.k = 0;
    const from = { ...t.driverPos }, start = performance.now();
    const step = now => {
      if (AppState.activeTrip !== t) return;
      const k = clamp((now - start) / ms, 0, 1), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      t.driverPos = Geo.lerp(from, target, e);
      if (t.isRealDriver) AppState.driverPos = { ...t.driverPos };
      MapView.moveMover(); UI.progress(k);
      if (k < 1) this.raf = requestAnimationFrame(step); else if (done) done();
    };
    this.raf = requestAnimationFrame(step);
  },
  startRide() {
    const t = AppState.activeTrip; if (!t || t.status !== 'arrived') return;
    Timers.clear('autostart');
    this.setStatus('in_progress');
    this.driveTo(t.dropoff, 16000, () => { if (!t.isRealDriver && AppState.activeTrip === t) Trip.complete(); }, Geo.etaMin(t.distKm));
  },
  complete() {
    const t = AppState.activeTrip; if (!t || t.status === 'completed') return;
    cancelAnimationFrame(this.raf); Timers.clearPrefix('auto');
    const d = AppState.driver; let commission = 0;
    if (t.isRealDriver) {
      commission = d.commissionPerTrip; d.walletBalance = Math.max(0, d.walletBalance - commission);
      AppState.transactions.unshift({ id: uid(), type: 'commission', amount: -commission, desc: `Comisión · ${shortAddr(t.pickup.address)} a ${shortAddr(t.dropoff.address)}`, ts: Date.now() });
    }
    t.summary = { fare: t.fare, commission, payment: t.payment };
    AppState.history.unshift({ id: t.id, ts: Date.now(), fare: t.fare, payment: t.payment, vehicle: t.vehicle, from: t.pickup.address, to: t.dropoff.address, fromPos: { lat: t.pickup.lat, lng: t.pickup.lng }, toPos: { lat: t.dropoff.lat, lng: t.dropoff.lng }, asDriver: !!t.isRealDriver, asPassenger: !!t.isRealPassenger, commission });
    if (t.isRealDriver && d.isOnline && d.walletBalance < d.commissionPerTrip) {
      d.isOnline = false; Driver.stopSim();
      toast('Saldo agotado: te desconectamos. Recarga para seguir recibiendo carreras.', 'danger');
    }
    this.setStatus('completed');
  },
  dismiss(who) {
    const t = AppState.activeTrip; if (!t) return;
    t.dismissed[who] = true;
    if (t.dismissed.p && t.dismissed.d) { AppState.activeTrip = null; AppState.passenger.tripStatus = 'idle'; if (Live.on) Live.clearTripWatch(); }
    AppState.ui.collapsed = false; render({ fit: true }); Store.save();
  },
  reset(msg, type) {
    if (Live.on) Live.clearTripWatch();
    cancelAnimationFrame(this.raf);
    Timers.clearPrefix('offer'); Timers.clearPrefix('auto'); Timers.clear('autostart'); Timers.clear('counter');
    AppState.activeTrip = null; AppState.offers = []; AppState.driver.activeRequest = null;
    AppState.passenger.tripStatus = 'idle'; this.k = 0;
    if (msg) toast(msg, type || 'info');
    render({ fit: true });
  }
};

/* =====================================================================
   PASAJERO
   ===================================================================== */
const Passenger = {
  async refreshPickupAddress() {
    const p = AppState.passenger, at = { lat: p.pickup.lat, lng: p.pickup.lng };
    const a = await Geocode.reverse(at.lat, at.lng);
    if (p.pickupMode === 'gps' && p.pickup.lat === at.lat && p.pickup.lng === at.lng) { p.pickup.address = a; if (!AppState.activeTrip) render(); }
  },
  request() {
    const p = AppState.passenger;
    if (AppState.activeTrip) { toast('Ya tienes un viaje en curso.', 'warn'); return; }
    if (p.pickupMode === 'gps' && AppState.me.status !== 'ok' && p.pickup.address.indexOf('Parque') === 0) {
      toast('Aún no tenemos tu GPS. Activa la ubicación o escribe tu dirección de recogida.', 'warn'); return;
    }
    const dist = Geo.road(p.pickup, p.dropoff);
    if (dist < 0.05) { toast('Elige un destino distinto al punto de recogida.', 'warn'); return; }
    if (Live.on) { Live.request(dist); return; }
    const trip = {
      id: uid(), isRealPassenger: true, isRealDriver: false, passengerName: Account.name(),
      pickup: { ...p.pickup }, dropoff: { ...p.dropoff }, vehicle: p.selectedVehicle, fare: p.offeredFare, payment: p.paymentMethod,
      distKm: dist, status: 'searching', driver: null, driverPos: null, note: p.note.trim(), pin: String(Math.floor(1000 + Math.random() * 9000)),
      dismissed: { p: false, d: true }
    };
    AppState.activeTrip = trip; AppState.offers = []; p.tripStatus = 'searching';
    AppState.ui.collapsed = false; AppState.ui.pick = null;
    Sim.scheduleOffers(trip); Driver.dispatchRealRequest();
    render({ fit: true }); Store.save();
  },
  raise() {
    const t = AppState.activeTrip, p = AppState.passenger;
    if (!t || t.status !== 'searching') return;
    if (Live.on) { Live.raise(); return; }
    t.fare += 500; p.offeredFare = t.fare;
    const r = AppState.driver.activeRequest;
    if (r && r.source === 'real' && r.status === 'new') r.fare = t.fare;
    toast(`Subiste tu oferta a ${fmt(t.fare)}`, 'ok');
    Sim.extraOffer(t); render(); Store.save();
  },
  acceptOffer(id) {
    const o = AppState.offers.find(x => x.id === id), t = AppState.activeTrip;
    if (!o || !t || t.status !== 'searching') return;
    if (Live.on) { Live.acceptOffer(o); return; }
    Timers.clearPrefix('offer');
    t.fare = o.fare;
    t.driver = { name: o.name, plate: o.plate, vehicle: o.vehicle, rating: o.rating, phone: o.phone, nequi: o.nequi, isReal: !!o.isReal };
    t.isRealDriver = !!o.isReal; t.dismissed.d = !t.isRealDriver;
    t.driverPos = { lat: o.lat, lng: o.lng };
    if (t.isRealDriver) AppState.driverPos = { ...t.driverPos };
    AppState.offers = []; AppState.driver.activeRequest = null;
    Trip.setStatus('accepted');
    Trip.driveTo(t.pickup, 11000, () => {
      if (AppState.activeTrip !== t || t.status !== 'accepted') return;
      if (!t.isRealDriver) {
        Trip.setStatus('arrived');
        toast(`${t.driver.name.split(' ')[0]} llegó al punto de recogida.`, 'ok');
        Timers.set('autostart', () => Trip.startRide(), 3500);
      } else toast('Tu conductor está en el punto de recogida.', 'ok');
    }, o.eta);
    toast('Conductor confirmado.', 'ok');
  },
  cancel() {
    const t = AppState.activeTrip;
    if (!t || !t.isRealPassenger || t.status === 'in_progress' || t.status === 'completed') return;
    if (Live.on) Live.cancelTrip(t.id);
    Trip.reset('Cancelaste el viaje.', 'info'); Store.save();
  },
  share() {
    const t = AppState.activeTrip; if (!t || !t.driver) return;
    const pos = t.driverPos || t.pickup;
    const text = `Voy en ${vehLabel(t.driver.vehicle).toLowerCase()} con ${t.driver.name}, placa ${t.driver.plate}, hacia ${shortAddr(t.dropoff.address)}. Ubicación del vehículo: https://maps.google.com/?q=${pos.lat},${pos.lng}`;
    if (navigator.share) navigator.share({ title: 'Mi viaje en TamboGo', text }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Datos del viaje copiados. Pégalos en WhatsApp.', 'ok'));
  }
};

/* =====================================================================
   SIMULADOR DE CONDUCTORES
   ===================================================================== */
const Sim = {
  makeOffer(trip, drv, fare) {
    const ang = rand(0, Math.PI * 2), dist = rand(0.004, 0.009);
    const pos = { lat: trip.pickup.lat + Math.sin(ang) * dist, lng: trip.pickup.lng + Math.cos(ang) * dist };
    return { id: uid(), name: drv.name, plate: drv.plate, vehicle: drv.vehicle, rating: drv.rating, phone: drv.phone, nequi: drv.phone, eta: Geo.etaMin(Geo.road(pos, trip.pickup)), fare, lat: pos.lat, lng: pos.lng, isReal: false };
  },
  scheduleOffers(trip) {
    if (Live.on) return;
    const pool = SIM_DRIVERS.filter(d => d.vehicle === trip.vehicle), delays = [1800, 3900, 6400];
    pool.slice(0, 3).forEach((drv, i) => {
      Timers.set('offer' + i, () => {
        const t = AppState.activeTrip;
        if (!t || t.id !== trip.id || t.status !== 'searching') return;
        AppState.offers.push(this.makeOffer(t, drv, t.fare + pick([0, 0, 500, 500, 1000]))); render();
      }, delays[i]);
    });
  },
  extraOffer(trip) {
    if (Live.on) return;
    const drv = pick(SIM_DRIVERS.filter(d => d.vehicle === trip.vehicle));
    Timers.set('offerX' + uid(), () => {
      const t = AppState.activeTrip;
      if (!t || t.id !== trip.id || t.status !== 'searching') return;
      AppState.offers.push(this.makeOffer(t, drv, t.fare)); render();
    }, 1500);
  }
};

/* =====================================================================
   CONDUCTOR
   ===================================================================== */
const Driver = {
  canOperate() { return AppState.driver.walletBalance >= AppState.driver.commissionPerTrip; },
  todayStats() {
    const s = new Date().setHours(0, 0, 0, 0), rows = AppState.history.filter(h => h.asDriver && h.ts >= s);
    return { total: rows.reduce((a, h) => a + h.fare, 0), count: rows.length };
  },
  toggleOnline() {
    const d = AppState.driver;
    if (AppState.activeTrip && AppState.activeTrip.isRealDriver) return;
    if (!d.isOnline) {
      if (!Account.driverOk()) { toast('Tu cuenta de conductor aún no está aprobada.', 'warn'); return; }
      if (!this.canOperate()) { toast('Saldo insuficiente. Recarga tu billetera para conectarte.', 'danger'); return; }
      GPS.start();
      if (Live.on && !Live.goOnline()) return;
      d.isOnline = true; toast('Estás en línea.', 'ok'); this.startSim(); this.dispatchRealRequest();
    } else { if (Live.on) Live.goOffline(); d.isOnline = false; d.activeRequest = null; this.stopSim(); toast('Te desconectaste.', 'info'); }
    render({ fit: true }); Store.save();
  },
  startSim() { if (Live.on) return; Timers.set('simreq0', () => this.spawnSimRequest(), 3500); Timers.every('simreq', () => this.spawnSimRequest(), 16000); },
  stopSim() { Timers.clear('simreq0'); Timers.stopEvery('simreq'); },
  spawnSimRequest() {
    const d = AppState.driver;
    if (!d.isOnline || d.activeRequest || AppState.activeTrip) return;
    let pickup, dropoff;
    if (AppState.me.status === 'ok') {
      const c = AppState.driverPos;
      pickup = { lat: c.lat + rand(-0.005, 0.005), lng: c.lng + rand(-0.005, 0.005), address: 'Punto cercano a ti (demo)' };
      dropoff = { lat: c.lat + rand(-0.01, 0.01), lng: c.lng + rand(-0.01, 0.01), address: 'Destino de prueba (demo)' };
    } else {
      const a = pick(PLACES); let b = pick(PLACES); while (b === a) b = pick(PLACES);
      pickup = { lat: a.lat + rand(-0.0006, 0.0006), lng: a.lng + rand(-0.0006, 0.0006), address: a.name };
      dropoff = { lat: b.lat, lng: b.lng, address: b.name };
    }
    const fare = Math.max(2000, Fare.suggestFor(d.vehicleType, pickup, dropoff) + pick([-500, 0, 0, 500]));
    d.activeRequest = { id: uid(), source: 'sim', status: 'new', passengerName: pick(SIM_PASSENGERS), pickup, dropoff, fare, payment: pick(['nequi', 'cash']), vehicle: d.vehicleType, distKm: Geo.road(pickup, dropoff), expiresAt: Date.now() + 25000, note: pick(['', '', 'Estoy en la puerta azul', 'Llevo un paquete pequeño']) };
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    Sound.beep(); AppState.ui.collapsed = false;
    if (AppState.currentRole === 'driver') render({ fit: true }); else toast('Llegó una solicitud en modo conductor.', 'info');
  },
  dispatchRealRequest() {
    if (Live.on) return;
    const d = AppState.driver, t = AppState.activeTrip;
    if (!d.isOnline || !t || !t.isRealPassenger || t.status !== 'searching' || t.rejectedByDriver || d.activeRequest) return;
    if (t.vehicle !== d.vehicleType || !this.canOperate()) return;
    d.activeRequest = { id: t.id, source: 'real', status: 'new', passengerName: t.passengerName, pickup: t.pickup, dropoff: t.dropoff, fare: t.fare, payment: t.payment, vehicle: t.vehicle, distKm: t.distKm, note: t.note };
  },
  accept(counter) {
    const d = AppState.driver, r = d.activeRequest;
    if (!r || r.status !== 'new') return;
    if (!this.canOperate()) { toast('Saldo insuficiente. Recarga para aceptar carreras.', 'danger'); return; }
    if (Live.on) { Live.sendOffer(r, counter); return; }
    const fare = r.fare + (counter ? 500 : 0);
    if (r.source === 'real') {
      const t = AppState.activeTrip;
      if (!t || t.id !== r.id) { d.activeRequest = null; render(); return; }
      AppState.offers.push({ id: uid(), name: d.name, plate: d.plate, vehicle: d.vehicleType, rating: 5.0, phone: d.phone, nequi: d.nequiNumber, eta: Geo.etaMin(Geo.road(AppState.driverPos, r.pickup)), fare, lat: AppState.driverPos.lat, lng: AppState.driverPos.lng, isReal: true });
      r.status = 'offered';
      toast(counter ? `Contraoferta de ${fmt(fare)} enviada.` : 'Oferta enviada al pasajero. Cambia a modo pasajero para aceptarla.', 'ok');
      render(); return;
    }
    if (counter) {
      r.status = 'negotiating'; render();
      Timers.set('counter', () => {
        if (!d.activeRequest || d.activeRequest.id !== r.id) return;
        if (Math.random() < 0.7) { toast('El pasajero aceptó tu contraoferta.', 'ok'); this.startSimTrip(r, fare); }
        else { d.activeRequest = null; toast('El pasajero prefirió otra oferta.', 'warn'); render({ fit: true }); }
      }, 2000);
    } else this.startSimTrip(r, fare);
  },
  startSimTrip(r, fare) {
    const d = AppState.driver;
    const t = { id: r.id, isRealPassenger: false, isRealDriver: true, passengerName: r.passengerName, pickup: r.pickup, dropoff: r.dropoff, vehicle: d.vehicleType, fare, payment: r.payment, distKm: r.distKm, note: r.note || '', pin: String(Math.floor(1000 + Math.random() * 9000)), status: 'accepted', driver: { name: d.name, plate: d.plate, vehicle: d.vehicleType, rating: 5.0, phone: d.phone, nequi: d.nequiNumber, isReal: true }, driverPos: { ...AppState.driverPos }, dismissed: { p: true, d: false } };
    AppState.activeTrip = t; d.activeRequest = null;
    Trip.setStatus('accepted');
    Trip.driveTo(t.pickup, 9000, null, Geo.etaMin(Geo.road(t.driverPos, t.pickup)));
  },
  reject() {
    const d = AppState.driver, r = d.activeRequest; if (!r) return;
    if (Live.on) Live.rejected.add(r.id);
    if (r.source === 'real' && AppState.activeTrip) AppState.activeTrip.rejectedByDriver = true;
    d.activeRequest = null; render({ fit: true });
  },
  arrived() { if (Live.on) { Live.driverStep('arrived'); return; } const t = AppState.activeTrip; if (t && t.isRealDriver && t.status === 'accepted') { cancelAnimationFrame(Trip.raf); Trip.setStatus('arrived'); } },
  start() {
    const t = AppState.activeTrip; if (!t || !t.isRealDriver || t.status !== 'arrived') return;
    const v = ($('#pin-in') || {}).value || '';
    if (Live.on) { Live.driverStep('in_progress', v); return; }
    if (v !== t.pin) { toast('PIN incorrecto. Pídeselo de nuevo al pasajero.', 'danger'); const i = $('#pin-in'); if (i) { i.classList.add('err'); i.focus(); } return; }
    Trip.startRide();
  },
  finish() { if (Live.on) { Live.finishTrip(); return; } const t = AppState.activeTrip; if (t && t.isRealDriver && t.status === 'in_progress') Trip.complete(); },
  cancelTrip() {
    const t = AppState.activeTrip;
    if (!t || !t.isRealDriver || !['accepted', 'arrived'].includes(t.status)) return;
    if (Live.on) { Live.driverCancel(); return; }
    cancelAnimationFrame(Trip.raf); Timers.clear('autostart');
    if (t.isRealPassenger) {
      t.driver = null; t.isRealDriver = false; t.dismissed.d = true; t.driverPos = null; t.rejectedByDriver = true; AppState.offers = [];
      Sim.scheduleOffers(t); Trip.setStatus('searching');
      toast('Cancelaste. El pasajero vuelve a buscar conductor.', 'info');
    } else Trip.reset('Cancelaste la carrera.', 'info');
  }
};

/* =====================================================================
   PANTALLAS: bienvenida, registro, menú, historial, perfil, compartir, ayuda
   ===================================================================== */
const Screens = {
  name: null, form: {}, step: 0, params: {}, tab: 'p',

  show(name, params) {
    this.name = name; this.params = params || {};
    const s = $('#screen'); s.hidden = false; s.scrollTop = 0;
    this.paint();
  },
  paint() {
    const html = Screens.tpl[this.name]();
    $('#screen-inner').innerHTML = html;
    if (this.name === 'share') Share.paint();
  },
  refresh() { const s = $('#screen'), k = s.scrollTop; this.paint(); s.scrollTop = k; },
  close() { $('#screen').hidden = true; this.name = null; },

  top(title, back = 'closeScreen') {
    return `<div class="flex items-center gap-3 mb-5 pt-1"><button class="w-11 h-11 rounded-2xl bg-white/5 border border-white/10 tap" data-act="${back}" aria-label="Volver"><i class="fa-solid fa-arrow-left"></i></button><h1 class="text-xl font-extrabold tracking-tight">${title}</h1></div>`;
  },
  F(label, key, o = {}) {
    return `<label class="block mb-3"><span class="block text-xs font-semibold text-zinc-400 mb-1.5">${label}</span>
      <input class="inp" data-form="${key}" type="${o.type || 'text'}" ${o.mode ? `inputmode="${o.mode}"` : ''} ${o.max ? `maxlength="${o.max}"` : ''} placeholder="${o.ph || ''}" value="${esc(this.form[key] || '')}" autocomplete="off">
      ${o.hint ? `<span class="block text-[11px] text-zinc-500 mt-1">${o.hint}</span>` : ''}</label>`;
  },
  Check(key, text) {
    return `<label class="flex items-start gap-3 mb-3 text-sm text-zinc-300"><input type="checkbox" data-form="${key}" ${this.form[key] ? 'checked' : ''} class="mt-0.5 w-5 h-5 accent-emerald-500 shrink-0"><span>${text}</span></label>`;
  },
  Seg(key, opts) {
    return `<div class="grid grid-cols-${opts.length} gap-2 mb-3">${opts.map(o => `<button type="button" class="pay tap ${this.form[key] === o.v ? 'on-cash' : ''}" data-act="formSet" data-k="${key}" data-v="${o.v}">${o.icon || ''}${o.l}</button>`).join('')}</div>`;
  },

  validate(kind, step) {
    const f = this.form, phone = /^3\d{9}$/;
    const bad = (k, msg) => ({ k, msg });
    if (kind === 'passenger') {
      if (!f.name || f.name.trim().length < 3) return bad('name', 'Escribe tu nombre completo.');
      if (!phone.test(f.phone || '')) return bad('phone', 'Tu celular debe tener 10 dígitos y empezar por 3.');
      if (Live.on) { const em = (f.email || '').trim().toLowerCase(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) return bad('email', 'Escribe un correo electrónico válido.'); if (em !== (f.email2 || '').trim().toLowerCase()) return bad('email2', 'Los dos correos deben ser iguales.'); }
      if (Live.on && (f.password || '').length < 6) return bad('password', 'La contraseña debe tener mínimo 6 caracteres.');
      if (!f.terms) return bad('terms', 'Acepta los términos para continuar.');
    } else if (step === 0) {
      if (!f.name || f.name.trim().length < 3) return bad('name', 'Escribe tu nombre completo.');
      if (!phone.test(f.phone || '')) return bad('phone', 'Tu celular debe tener 10 dígitos y empezar por 3.');
      if (!/^\d{6,10}$/.test(f.cedula || '')) return bad('cedula', 'Escribe tu número de cédula (6 a 10 dígitos).');
      if (Live.on && !AppState.account) { const em = (f.email || '').trim().toLowerCase(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) return bad('email', 'Escribe un correo electrónico válido.'); if (em !== (f.email2 || '').trim().toLowerCase()) return bad('email2', 'Los dos correos deben ser iguales.'); }
      if (Live.on && !AppState.account && (f.password || '').length < 6) return bad('password', 'La contraseña debe tener mínimo 6 caracteres.');
    } else if (step === 1) {
      if (!/^[A-Z]{3}-?[0-9]{2,3}[A-Z]?$/.test(f.plate || '')) return bad('plate', 'Placa no válida. Ejemplo: ABC-12D o TUC-123.');
      if (!f.brand || f.brand.trim().length < 2) return bad('brand', 'Escribe la marca del vehículo.');
      if (!f.color || f.color.trim().length < 3) return bad('color', 'Escribe el color del vehículo.');
      if (!f.license || f.license.trim().length < 5) return bad('license', 'Escribe el número de tu licencia de conducción.');
      if (!f.soat) return bad('soat', 'Necesitas SOAT vigente para conducir en TamboGo.');
      if (!f.docs) return bad('docs', 'Confirma que tienes tus documentos al día.');
    } else {
      if (!phone.test(f.nequi || '')) return bad('nequi', 'Escribe el número de Nequi (10 dígitos).');
      if (!f.terms) return bad('terms', 'Acepta los términos para continuar.');
    }
    return null;
  },
  flagError(e) {
    toast(e.msg, 'warn');
    const el = document.querySelector(`[data-form="${e.k}"]`);
    if (el) { el.classList.add('err'); if (el.focus) el.focus(); }
  },

/* Compartir / QR */
const Share = {
  url(kind) {
    let base = (AppState.publicUrl || '').trim();
    if (!base) base = location.origin && location.origin !== 'null' ? location.origin + location.pathname : location.href.split(/[?#]/)[0];
    return base.replace(/[?#].*$/, '') + '?ref=' + kind;
  },
  paint() { makeQR('#qr-box', this.url(Screens.params.kind || 'passenger'), 212); },
  async poster() {
    const kind = Screens.params.kind || 'passenger', url = this.url(kind);
    const W = 1080, H = 1500, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#09090b'; x.fillRect(0, 0, W, H);
    const g = x.createRadialGradient(W / 2, 330, 40, W / 2, 330, 760); g.addColorStop(0, 'rgba(16,185,129,.38)'); g.addColorStop(1, 'rgba(16,185,129,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const img = new Image();
    await new Promise(res => { img.onload = res; img.onerror = res; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(Logo.icon(240)); });
    x.drawImage(img, W / 2 - 120, 90, 240, 240);
    x.font = '800 104px "Plus Jakarta Sans", system-ui, sans-serif';
    const w1 = x.measureText('Tambo').width, w2 = x.measureText('Go').width, sx = W / 2 - (w1 + w2) / 2;
    x.textAlign = 'left'; x.fillStyle = '#fafafa'; x.fillText('Tambo', sx, 470); x.fillStyle = '#34d399'; x.fillText('Go', sx + w1, 470);
    x.textAlign = 'center'; x.fillStyle = '#fafafa'; x.font = '800 60px "Plus Jakarta Sans", system-ui, sans-serif';
    x.fillText(kind === 'driver' ? 'Maneja con TamboGo' : 'Pide tu moto o tuctuc', W / 2, 590);
    x.fillStyle = '#a1a1aa'; x.font = '500 38px "Plus Jakarta Sans", system-ui, sans-serif';
    x.fillText(kind === 'driver' ? 'Escanea y regístrate como conductor' : 'Escanea y viaja por el precio que tú propones', W / 2, 655);
    x.fillStyle = '#ffffff'; x.beginPath(); x.roundRect ? x.roundRect(240, 720, 600, 600, 48) : x.rect(240, 720, 600, 600); x.fill();
    const qc = document.querySelector('#qr-box canvas'), qi = document.querySelector('#qr-box img');
    const src = qc || qi; if (src) x.drawImage(src, 280, 760, 520, 520);
    x.fillStyle = '#71717a'; x.font = '500 30px "Plus Jakarta Sans", system-ui, sans-serif';
    x.fillText('Servicio local · El Tambo, Cauca', W / 2, 1400);
    const a = document.createElement('a'); a.download = `tambogo-qr-${kind}.png`; a.href = c.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove();
    toast('Cartel descargado.', 'ok');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && Actions[el.dataset.act]) { if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault(); Actions[el.dataset.act](el.dataset, el); }
  else if (e.target.id === 'modal' && AppState.ui.rechargeState !== 'verifying') Wallet.close();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pick-q') { Pick.onInput(t.value); return; }
  if (t.id === 'trip-note') { AppState.passenger.note = t.value; return; }
  if (t.id === 'public-url') { AppState.publicUrl = t.value; Store.save(); Share.paint(); const u = document.querySelector('#screen .break-all'); if (u) u.textContent = Share.url(Screens.params.kind || 'passenger'); return; }
  if (t.id === 'pin-in') { t.value = t.value.replace(/\D/g, '').slice(0, 4); t.classList.remove('err'); return; }
  const k = t.dataset && t.dataset.form;
  if (!k) return;
  if (['phone', 'nequi', 'cedula'].includes(k)) t.value = t.value.replace(/\D/g, '').slice(0, k === 'cedula' ? 10 : 10);
  if (k === 'plate') t.value = t.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
  Screens.form[k] = t.type === 'checkbox' ? t.checked : t.value;
  t.classList.remove('err');
});

document.addEventListener('change', e => {
  if (e.target.id === 'avatar-file' && e.target.files && e.target.files[0]) {
    readAvatar(e.target.files[0], data => { AppState.account.avatar = data; if (Live.on) Live.saveAvatar(data); Store.save(); Screens.refresh(); render(); toast('Foto actualizada.', 'ok'); });

document.querySelectorAll('.handle-hit').forEach(h => {
  let y0 = null;
  h.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  h.addEventListener('touchend', e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (Math.abs(dy) > 30) { AppState.ui.collapsed = dy > 0; render({ fit: true }); }
  }, { passive: true });
});

setInterval(() => {
  const r = AppState.driver.activeRequest;
  if (!r || r.source !== 'sim' || r.status !== 'new') return;
  const left = Math.ceil((r.expiresAt - Date.now()) / 1000);
  if (left <= 0) { AppState.driver.activeRequest = null; toast('La solicitud venció.', 'warn'); render({ fit: true }); return; }
  const c = $('#req-count'); if (c) c.textContent = left + 's';
  const b = $('#req-bar'); if (b) b.style.width = (left / 25 * 100) + '%';
}, 500);
