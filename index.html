const Live = {
  on: false, db: null, auth: null, uid: null, pin: null,
  unsubs: {}, started: false, dStarted: false, registering: false, manual: false, walletReady: false,
  metaCache: {}, settings: {},
  rejected: new Set(), myOffers: new Set(), driverList: [], near: 0, _res: null, _anim: null, ready: null,

  init() {
    this.ready = new Promise(r => { this._res = r; });
    try {
      const c = CONFIG.firebase;
      if (!c.apiKey || typeof firebase === 'undefined') { this._res(); this._res = null; return; }
      firebase.initializeApp(c);
      this.auth = firebase.auth(); this.db = firebase.firestore();
      this.auth.languageCode = 'es';
      this.on = true; AppState.driver.walletBalance = 0;
      this.auth.onAuthStateChanged(async u => {
        if (this.registering || this.manual) return;
        if (u) { try { await this.loadProfile(u); } catch (e) { console.warn(e); } }
        else { this.stopAll(); AppState.account = null; AppState.session = false; }
        if (this._res) { this._res(); this._res = null; }
      });
      setInterval(() => this.paintDrivers(), 20000);
    } catch (e) { console.warn('Firebase no disponible', e); this.on = false; if (this._res) { this._res(); this._res = null; } }
  },

  ts() { return firebase.firestore.FieldValue.serverTimestamp(); },
  inc(n) { return firebase.firestore.FieldValue.increment(n); },
  email(p) { const [u, d] = CONFIG.emailBase.split('@'); return `${u}+${p}@${d}`; },
  legacyEmail(p) { return p + '@tambogo.app'; },
  col(n) { return this.db.collection(n); },
  err(e) {
    console.warn(e);
    const c = (e && e.code) || '';
    toast(c === 'permission-denied' ? 'Acción no permitida. Revisa tu cuenta o las reglas de Firestore.' : c === 'unavailable' ? 'Sin conexión. Intenta de nuevo.' : 'Ocurrió un error. Intenta de nuevo.', 'danger');
  },
  authErr(e) {
    const m = {
      'auth/email-already-in-use': 'Ese correo ya tiene cuenta. Toca “Ya tengo cuenta”.',
      'auth/invalid-email': 'El correo no es válido.',
      'auth/weak-password': 'La contraseña es muy corta (mínimo 6).',
      'auth/invalid-credential': 'Celular o contraseña incorrectos.',
      'auth/wrong-password': 'Celular o contraseña incorrectos.',
      'auth/user-not-found': 'Celular o contraseña incorrectos.',
      'auth/network-request-failed': 'Sin conexión. Intenta de nuevo.',
      'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.'
    };
    console.warn(e);
    toast(m[(e && e.code) || ''] || 'No se pudo completar. Intenta de nuevo.', 'danger');
  },

  /* ---------- Cuentas ---------- */
  async loadProfile(u) {
    this.uid = u.uid;
    const us = await this.col('users').doc(u.uid).get();
    if (!us.exists) { AppState.account = null; AppState.session = false; return; }
    const ud = us.data();
    const realEmail = u.email && !/@tambogo\.app$/.test(u.email) && !u.email.startsWith(CONFIG.emailBase.split('@')[0] + '+');
    const acc = { id: u.uid, name: ud.name, phone: ud.phone, email: realEmail ? u.email : '', avatar: ud.avatar || null, passenger: true, payment: AppState.passenger.paymentMethod || 'cash', driver: null, admin: !!ud.admin };
    const ds = await this.col('drivers').doc(u.uid).get();
    if (ds.exists) {
      const dd = ds.data(); let pr = {};
      try { const p = await this.col('driverPrivate').doc(u.uid).get(); pr = p.exists ? p.data() : {}; } catch (e) { pr = {}; }
      acc.driver = { cedula: pr.cedula, vehicleType: dd.vehicleType, plate: dd.plate, brand: dd.brand, color: dd.color, license: pr.license, nequi: pr.nequi || ud.phone, status: dd.status, rating: dd.ratingCount ? (dd.ratingSum / dd.ratingCount).toFixed(1) : 'Nuevo' };
      this.col('drivers').doc(u.uid).update({ online: false }).catch(() => {});
    }
    AppState.account = acc; AppState.session = true;
    Account.applyDriver(); Store.save();
    if (acc.email) this.ensurePhoneIndex(acc.email, u.uid, ud.phone);
    this.startListeners(); this.startDriverListeners();
    this.loadSettings(); this.loadHistory();
  },

  async registerPassenger(f) {
    this.registering = true;
    try {
      if (await this.phoneTaken(f.phone)) { this.registering = false; toast('Ese celular ya está registrado. Ingresa con tu correo o recupera tu contraseña.', 'warn'); return; }
      const cred = await this.auth.createUserWithEmailAndPassword(f.email.trim().toLowerCase(), f.password);
      if (this.auth.currentUser) this.auth.currentUser.sendEmailVerification().catch(() => {});
      await this.col('users').doc(cred.user.uid).set({ name: f.name.trim(), phone: f.phone, createdAt: this.ts() });
      await this.indexPhone(f.phone, f.email.trim().toLowerCase(), cred.user.uid);
      AppState.passenger.paymentMethod = f.payment || 'cash';
      this.registering = false;
      await this.loadProfile(cred.user);
      Screens.show('gps');
    } catch (e) { this.registering = false; this.authErr(e); }
  },

  async registerDriver(f) {
    this.registering = true;
    try {
      let user = this.auth.currentUser;
      if (!user) {
        if (await this.phoneTaken(f.phone)) { this.registering = false; toast('Ese celular ya está registrado. Ingresa con tu correo o recupera tu contraseña.', 'warn'); return; }
        const cred = await this.auth.createUserWithEmailAndPassword(f.email.trim().toLowerCase(), f.password);
      if (this.auth.currentUser) this.auth.currentUser.sendEmailVerification().catch(() => {});
        user = cred.user;
        await this.col('users').doc(user.uid).set({ name: f.name.trim(), phone: f.phone, createdAt: this.ts() });
        await this.indexPhone(f.phone, f.email.trim().toLowerCase(), user.uid);
      }
      const uid = user.uid, b = this.db.batch();
      b.set(this.col('drivers').doc(uid), { name: f.name.trim(), vehicleType: f.vehicleType, plate: f.plate, brand: f.brand.trim(), color: f.color.trim(), status: 'pending', online: false, ratingSum: 0, ratingCount: 0, updatedAt: this.ts() });
      b.set(this.col('driverPrivate').doc(uid), { cedula: f.cedula, license: f.license.trim(), phone: f.phone, nequi: f.nequi });
      b.set(this.col('wallets').doc(uid), { balance: 0, lastTripId: '' });
      await b.commit();
      this.registering = false;
      await this.loadProfile(user);
      Screens.show('driverPending');
    } catch (e) { this.registering = false; this.authErr(e); }
  },

  async login(id, pass) {
    id = (id || '').trim().toLowerCase();
    if (!id || !pass) { toast('Escribe tu correo y tu contraseña.', 'warn'); return; }
    this.manual = true;
    try {
      let cred;
      if (id.includes('@')) cred = await this.auth.signInWithEmailAndPassword(id, pass);
      else if (/^3\d{9}$/.test(id)) {
        let mapped = null;
        try { const d = await this.col('phoneIndex').doc(id).get(); mapped = d.exists ? d.data().email : null; } catch (e0) { mapped = null; }
        if (mapped) cred = await this.auth.signInWithEmailAndPassword(mapped, pass);
        else {
          try { cred = await this.auth.signInWithEmailAndPassword(this.email(id), pass); }
          catch (e1) {
            if (['auth/invalid-credential', 'auth/user-not-found', 'auth/wrong-password'].includes(e1 && e1.code)) cred = await this.auth.signInWithEmailAndPassword(this.legacyEmail(id), pass);
            else throw e1;
          }
        }
      } else { this.manual = false; toast('Escribe tu correo electrónico.', 'warn'); return; }
      await this.loadProfile(cred.user);
      this.manual = false;
      Onboard.enterApp();
    } catch (e) {
      this.manual = false;
      if (!id.includes('@') && e && ['auth/invalid-credential', 'auth/user-not-found', 'auth/wrong-password'].includes(e.code)) { toast('Celular o contraseña incorrectos. También puedes ingresar con tu correo.', 'warn'); return; }
      this.authErr(e);
    }
  },

  logout() { this.stopAll(); AppState.activeTrip = null; AppState.offers = []; AppState.driver.isOnline = false; if (this.auth) this.auth.signOut().catch(() => {}); },
  saveProfile() {
    const a = AppState.account; if (!this.uid) return;
    this.col('users').doc(this.uid).update({ name: a.name }).catch(e => this.err(e));
    if (a.driver) {
      this.col('drivers').doc(this.uid).update({ name: a.name }).catch(() => {});
      this.col('driverPrivate').doc(this.uid).update({ nequi: a.driver.nequi }).catch(() => {});
    }
  },
  saveAvatar(data) { if (this.uid) this.col('users').doc(this.uid).update({ avatar: data }).catch(e => this.err(e)); },

  stopAll() {
    Object.values(this.unsubs).forEach(f => { try { f(); } catch (e) { /* ya cerrado */ } });
    this.unsubs = {}; this.started = false; this.dStarted = false; this.walletReady = false;
    Timers.stopEvery('pub'); this.uid = null;
  },

  /* ---------- Escuchas ---------- */
  startListeners() {
    if (this.started || !this.uid) return;
    this.started = true;
    this.unsubs.drivers = this.col('drivers').where('online', '==', true).onSnapshot(s => {
      this.driverList = s.docs.filter(x => x.id !== this.uid).map(x => x.data()); this.paintDrivers();
    }, () => {});
    this.col('trips').where('passengerId', '==', this.uid).where('status', 'in', ['searching', 'accepted', 'arrived', 'in_progress']).limit(1).get().then(async s => {
      if (s.empty || AppState.activeTrip) return;
      const id = s.docs[0].id;
      try { const pd = await this.col('trips').doc(id).collection('private').doc('pin').get(); this.pin = pd.exists ? pd.data().pin : '----'; } catch (e) { this.pin = '----'; }
      this.watchTrip(id);
    }).catch(() => {});
  },

  startDriverListeners() {
    const a = AppState.account;
    if (!a || !a.driver || this.dStarted || !this.uid) return;
    this.dStarted = true;
    const uid = this.uid;
    this.unsubs.drv = this.col('drivers').doc(uid).onSnapshot(s => {
      const st = s.exists && s.data().status;
      if (st && AppState.account && AppState.account.driver && st !== AppState.account.driver.status) {
        AppState.account.driver.status = st;
        if (st === 'approved') { toast('¡Tu cuenta de conductor fue aprobada!', 'ok'); if (Screens.name === 'driverPending') Screens.show('driverDone'); }
        else if (st === 'rejected') toast('Tu solicitud de conductor no fue aprobada. Contáctanos.', 'danger');
        render();
      }
    }, () => {});
    this.unsubs.wallet = this.col('wallets').doc(uid).onSnapshot(s => {
      if (!s.exists) return;
      const b = s.data().balance || 0, old = AppState.driver.walletBalance, d = AppState.driver;
      d.walletBalance = b;
      if (b > old && this.walletReady) { toast(`Saldo acreditado: ${fmt(b - old)}`, 'ok'); if (AppState.ui.rechargeState === 'pending') AppState.ui.rechargeState = 'done'; }
      this.walletReady = true;
      if (d.isOnline && b < d.commissionPerTrip && !(AppState.activeTrip && AppState.activeTrip.isRealDriver)) {
        this.goOffline(); d.isOnline = false; toast('Saldo agotado: te desconectamos. Recarga para seguir.', 'danger');
      }
      if (AppState.currentRole === 'driver' || AppState.ui.recharge) render(); else UI.modal();
      Store.save();
    }, () => {});
    this.unsubs.tx = this.col('wallets').doc(uid).collection('tx').orderBy('ts', 'desc').limit(5).onSnapshot(s => {
      AppState.transactions = s.docs.map(x => { const v = x.data(); return { id: x.id, type: v.type, amount: v.amount, desc: v.desc, ts: v.ts && v.ts.toMillis ? v.ts.toMillis() : Date.now() }; });
      if (AppState.currentRole === 'driver') render();
    }, () => {});
    this.unsubs.dtrips = this.col('trips').where('driverId', '==', uid).where('status', 'in', ['accepted', 'arrived', 'in_progress']).onSnapshot(s => this.onDriverTrips(s), () => {});
  },

  /* ---------- Marcadores de conductores en línea ---------- */
  paintDrivers() {
    if (!MapView.amb) return;
    MapView.amb.clearLayers();
    const now = Date.now(), base = AppState.passenger.pickup; let n = 0;
    (this.driverList || []).forEach(d => {
      if (d.lat == null || d.lng == null) return;
      const age = d.updatedAt && d.updatedAt.toMillis ? now - d.updatedAt.toMillis() : 0;
      if (age > 120000 || Geo.km(base, d) > 10) return;
      n++; L.marker([d.lat, d.lng], { icon: MapView.icons.amb(d.vehicleType), interactive: false }).addTo(MapView.amb);
    });
    this.near = n;
    document.querySelectorAll('.js-ndrv').forEach(e => { e.textContent = n; });
  },

  /* ---------- Pasajero ---------- */
  async request(dist) {
    if (this.settings && this.settings.serviceOpen === false) { toast(this.settings.notice || 'El servicio está pausado por ahora.', 'warn'); return; }
    const p = AppState.passenger, a = AppState.account;
    const ref = this.col('trips').doc(), pin = String(Math.floor(1000 + Math.random() * 9000));
    this.pin = pin;
    try {
      const b = this.db.batch();
      b.set(ref, { passengerId: this.uid, passengerName: a.name, pickup: { ...p.pickup }, dropoff: { ...p.dropoff }, vehicle: p.selectedVehicle, fare: p.offeredFare, payment: p.paymentMethod, distKm: dist, note: p.note.trim(), status: 'searching', driverId: null, driverInfo: null, driverPos: null, createdAt: this.ts() });
      b.set(ref.collection('private').doc('pin'), { pin });
      await b.commit();
      AppState.ui.pick = null; AppState.ui.collapsed = false;
      this.watchTrip(ref.id);
    } catch (e) { this.err(e); }
  },

  watchTrip(id) {
    this.clearTripWatch();
    const tr = this.col('trips').doc(id);
    this.unsubs.trip = tr.onSnapshot(d => this.onPassengerTrip(d), e => this.err(e));
    this.unsubs.offers = tr.collection('offers').onSnapshot(async s => {
      const list = await Promise.all(s.docs.map(async x => {
        const o = { id: x.id, ...x.data(), isReal: false }, m = await this.driverMeta(x.id);
        if (m) { o.rating = m.rating; o.plate = m.plate; o.name = m.name; o.vehicle = m.vehicle; }
        return o;
      }));
      AppState.offers = list;
      const t = AppState.activeTrip; if (t && t.status === 'searching') render();
    }, () => {});
  },
  clearTripWatch() {
    ['trip', 'offers'].forEach(k => { if (this.unsubs[k]) { this.unsubs[k](); delete this.unsubs[k]; } });
    AppState.offers = [];
  },

  onPassengerTrip(doc) {
    if (!doc.exists) return;
    const d = doc.data(), prev = AppState.activeTrip;
    if (d.status === 'cancelled') { if (prev && prev.id === doc.id) Trip.reset('El viaje fue cancelado.', 'warn'); return; }
    const same = !!(prev && prev.id === doc.id);
    const t = {
      id: doc.id, isRealPassenger: true, isRealDriver: false, passengerName: d.passengerName, driverId: d.driverId || null, rated: !!d.rating,
      pickup: d.pickup, dropoff: d.dropoff, vehicle: d.vehicle, fare: d.fare, payment: d.payment, distKm: d.distKm || 1, note: d.note || '',
      pin: this.pin || '----', status: d.status, driver: d.driverInfo ? { ...d.driverInfo, isReal: false } : null,
      driverPos: d.driverPos || null, dismissed: { p: same ? prev.dismissed.p : false, d: true }, rating: d.rating || (same ? prev.rating : 0)
    };
    if (same) { t._leg = prev._leg; t._d0 = prev._d0; t.recorded = prev.recorded; t.summary = prev.summary; }
    const changed = !same || prev.status !== t.status || prev.fare !== t.fare || (!!prev.driver !== !!t.driver);
    const moved = same && prev.driverPos && t.driverPos && (prev.driverPos.lat !== t.driverPos.lat || prev.driverPos.lng !== t.driverPos.lng);
    let target = null;
    if (same && moved && !changed) { target = t.driverPos; t.driverPos = prev.driverPos; }
    if (same && prev.status === 'accepted' && t.status === 'searching') toast('El conductor canceló. Buscando otro conductor…', 'warn');
    if (same && prev.status === 'searching' && t.status === 'accepted') { toast('¡Conductor confirmado!', 'ok'); Notify.show('¡Conductor confirmado!', 'Tu conductor va en camino.'); }
    if (same && prev.status !== 'arrived' && t.status === 'arrived') { toast('Tu conductor llegó. Dile tu PIN al subir.', 'ok'); Notify.show('Tu conductor llegó', 'Dile tu PIN al subir.'); }
    AppState.activeTrip = t; AppState.passenger.tripStatus = t.status;
    if (t.status === 'searching') {
      AppState.passenger.offeredFare = t.fare;
      Timers.set('nooffer', () => { const c = AppState.activeTrip; if (c && c.status === 'searching' && !AppState.offers.length) toast('Aún no hay ofertas. Sube tu tarifa para atraer conductores.', 'info'); }, 60000);
    } else Timers.clear('nooffer');
    if (t.status === 'completed' && !t.recorded) {
      t.recorded = true;
      AppState.history.unshift({ id: t.id, ts: Date.now(), fare: t.fare, payment: t.payment, vehicle: t.vehicle, from: t.pickup.address, to: t.dropoff.address, fromPos: { lat: t.pickup.lat, lng: t.pickup.lng }, toPos: { lat: t.dropoff.lat, lng: t.dropoff.lng }, asDriver: false, asPassenger: true, commission: 0 });
      Store.save();
    }
    if (changed) { Trip.k = 0; t._d0 = null; this.tickProgress(); AppState.ui.collapsed = false; render({ fit: true }); }
    else if (target) this.tween(target);
  },

  tween(to) {
    cancelAnimationFrame(this._anim);
    const t0 = AppState.activeTrip; if (!t0 || !t0.driverPos) return;
    const from = { ...t0.driverPos }, start = performance.now();
    const step = now => {
      const cur = AppState.activeTrip; if (!cur || cur.id !== t0.id) return;
      const k = clamp((now - start) / 1200, 0, 1);
      cur.driverPos = Geo.lerp(from, to, k); this.tickProgress();
      if (k < 1) this._anim = requestAnimationFrame(step);
    };
    this._anim = requestAnimationFrame(step);
  },

  tickProgress() {
    const t = AppState.activeTrip; if (!t || !t.driverPos) return;
    const target = t.status === 'in_progress' ? t.dropoff : t.pickup, dist = Geo.km(t.driverPos, target);
    if (t._leg !== t.status || !t._d0) { t._leg = t.status; t._d0 = Math.max(dist, 0.05); }
    Trip.etaTotal = Geo.etaMin(t._d0);
    UI.progress(clamp(1 - dist / t._d0, 0, 1));
    MapView.moveMover();
  },

  async raise() {
    const t = AppState.activeTrip; if (!t) return;
    try { await this.col('trips').doc(t.id).update({ fare: this.inc(500) }); toast('Subiste tu oferta $500.', 'ok'); } catch (e) { this.err(e); }
  },
  async acceptOffer(o) {
    const t = AppState.activeTrip; if (!t) return;
    try {
      await this.col('trips').doc(t.id).update({ status: 'accepted', driverId: o.id, fare: o.fare, passengerPhone: AppState.account.phone, driverInfo: { name: o.name, plate: o.plate, vehicle: o.vehicle, rating: o.rating || 5, phone: o.phone, nequi: o.nequi }, acceptedAt: this.ts() });
    } catch (e) { this.err(e); }
  },
  cancelTrip(id) { this.col('trips').doc(id).update({ status: 'cancelled' }).catch(e => this.err(e)); },
  submitRating() {
    const t = AppState.activeTrip;
    if (!t || !t.rating || !t.driverId || t.rated) return;
    const b = this.db.batch();
    b.update(this.col('trips').doc(t.id), { rating: t.rating });
    b.update(this.col('drivers').doc(t.driverId), { ratingSum: this.inc(t.rating), ratingCount: this.inc(1), lastRatedTrip: t.id });
    b.commit().catch(e => console.warn('No se pudo guardar la calificación', e));
  },

  fresh(x) { const t = x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : Date.now(); return Date.now() - t < 20 * 60000; },

  async driverMeta(id) {
    const c = this.metaCache[id];
    if (c && Date.now() - c.t < 60000) return c.v;
    try {
      const v = (await this.col('drivers').doc(id).get()).data();
      const m = { rating: v.ratingCount ? (v.ratingSum / v.ratingCount).toFixed(1) : 'Nuevo', plate: v.plate, name: v.name, vehicle: v.vehicleType };
      this.metaCache[id] = { t: Date.now(), v: m }; return m;
    } catch (e) { return null; }
  },

  async loadSettings() {
    try {
      const [g, p] = await Promise.all([this.col('settings').doc('general').get(), this.col('settings').doc('pricing').get()]);
      if (g.exists) { this.settings = g.data(); if (this.settings.nequi) CONFIG.nequiPlataforma = this.settings.nequi; }
      if (p.exists) { const v = p.data(); ['moto', 'tuctuc'].forEach(k => { if (v[k]) Fare.rates[k] = Object.assign({}, Fare.rates[k], v[k]); }); }
      this.applyNotice();
      if (!AppState.activeTrip) { AppState.passenger.offeredFare = Fare.suggest(); render(); }
    } catch (e) { console.warn('No se pudieron cargar los ajustes', e); }
  },
  applyNotice() {
    const el = $('#notice'), g = this.settings || {};
    const msg = g.serviceOpen === false ? (g.notice || 'El servicio está pausado por ahora.') : (g.notice || '');
    if (el) { el.textContent = msg; el.hidden = !msg; el.className = g.serviceOpen === false ? 'bad' : ''; }
  },

  async loadHistory() {
    try {
      const [a, b] = await Promise.all([this.col('trips').where('passengerId', '==', this.uid).get(), this.col('trips').where('driverId', '==', this.uid).get()]);
      const rows = [];
      const add = (d, asD) => {
        const v = d.data(); if (v.status !== 'completed') return;
        const ts = v.completedAt && v.completedAt.toMillis ? v.completedAt.toMillis() : (v.createdAt && v.createdAt.toMillis ? v.createdAt.toMillis() : Date.now());
        rows.push({ id: d.id + (asD ? 'd' : 'p'), ts, fare: v.fare, payment: v.payment, vehicle: v.vehicle, from: v.pickup.address, to: v.dropoff.address, fromPos: { lat: v.pickup.lat, lng: v.pickup.lng }, toPos: { lat: v.dropoff.lat, lng: v.dropoff.lng }, asDriver: asD, asPassenger: !asD, commission: asD ? AppState.driver.commissionPerTrip : 0 });
      };
      a.docs.forEach(d => add(d, false)); b.docs.forEach(d => add(d, true));
      rows.sort((x, y) => y.ts - x.ts);
      AppState.history = rows.slice(0, 50); Store.save();
    } catch (e) { console.warn('No se pudo cargar el historial', e); }
  },

  sos() {
    const a = AppState.account, t = AppState.activeTrip;
    const p = AppState.me.status === 'ok' ? AppState.me : ((t && t.driverPos) || AppState.passenger.pickup);
    this.col('alerts').add({ uid: this.uid, name: a.name, phone: a.phone, role: AppState.currentRole, tripId: t ? t.id : '', lat: p.lat, lng: p.lng, status: 'open', createdAt: this.ts() })
      .then(() => toast('Alerta enviada a TamboGo.', 'ok')).catch(e => this.err(e));
  },

  /* ---------- Conductor ---------- */
  goOnline() {
    if (AppState.me.status !== 'ok') { GPS.start(); toast('Activa el GPS para conectarte y recibir pasajeros cercanos.', 'warn'); return false; }
    this.rejected.clear(); this.publish(true);
    Timers.every('pub', () => this.publish(true), 4000);
    if (this.unsubs.req) this.unsubs.req();
    this.unsubs.req = this.col('trips').where('status', '==', 'searching').where('vehicle', '==', AppState.driver.vehicleType).onSnapshot(s => this.onRequests(s), e => this.err(e));
    return true;
  },
  goOffline() {
    Timers.stopEvery('pub');
    if (this.unsubs.req) { this.unsubs.req(); delete this.unsubs.req; }
    AppState.driver.activeRequest = null;
    if (this.uid) this.col('drivers').doc(this.uid).update({ online: false, updatedAt: this.ts() }).catch(() => {});
  },
  publish(online) {
    if (!this.uid) return;
    const p = AppState.driverPos;
    this.col('drivers').doc(this.uid).update({ online, lat: p.lat, lng: p.lng, updatedAt: this.ts() }).catch(() => {});
    const t = AppState.activeTrip;
    if (t && t.isRealDriver && t.status !== 'completed') this.col('trips').doc(t.id).update({ driverPos: { lat: p.lat, lng: p.lng } }).catch(() => {});
  },

  onRequests(snap) {
    const d = AppState.driver;
    if (!d.isOnline || AppState.activeTrip) return;
    const list = snap.docs.map(x => ({ id: x.id, ...x.data() }))
      .filter(x => !this.rejected.has(x.id) && this.fresh(x) && Geo.km(AppState.driverPos, x.pickup) <= 6)
      .sort((a, b) => Geo.km(AppState.driverPos, a.pickup) - Geo.km(AppState.driverPos, b.pickup));
    const cur = d.activeRequest;
    if (cur) {
      const still = list.find(x => x.id === cur.id);
      if (still) { if (cur.status === 'new') cur.fare = still.fare; if (AppState.currentRole === 'driver') render(); return; }
      d.activeRequest = null;
    }
    if (list.length) {
      const x = list[0];
      d.activeRequest = { id: x.id, source: 'live', status: this.myOffers.has(x.id) ? 'offered' : 'new', passengerName: x.passengerName, pickup: x.pickup, dropoff: x.dropoff, fare: x.fare, payment: x.payment, vehicle: x.vehicle, distKm: x.distKm || 1, note: x.note || '' };
      if (d.activeRequest.status === 'new') {
        Sound.beep(); if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        Notify.show('Nueva solicitud', `${fmt(x.fare)} · ${shortAddr(x.pickup.address)}`);
        if (AppState.currentRole !== 'driver') toast('Llegó una solicitud en modo conductor.', 'info');
      }
      AppState.ui.collapsed = false;
    }
    if (AppState.currentRole === 'driver') render({ fit: true });
  },

  async sendOffer(r, counter) {
    const d = AppState.driver, fare = r.fare + (counter ? 500 : 0);
    try {
      await this.col('trips').doc(r.id).collection('offers').doc(this.uid).set({ driverId: this.uid, name: d.name, plate: d.plate, vehicle: d.vehicleType, rating: String(AppState.account.driver.rating), phone: d.phone, nequi: d.nequiNumber, fare, eta: Geo.etaMin(Geo.road(AppState.driverPos, r.pickup)), lat: AppState.driverPos.lat, lng: AppState.driverPos.lng, createdAt: this.ts() });
      this.myOffers.add(r.id); r.status = 'offered';
      toast(counter ? `Contraoferta de ${fmt(fare)} enviada.` : 'Oferta enviada. Esperando al pasajero.', 'ok');
      render();
    } catch (e) { this.err(e); }
  },

  onDriverTrips(snap) {
    const cur = AppState.activeTrip;
    if (snap.empty) { if (cur && cur.isRealDriver && cur.status !== 'completed') Trip.reset('El pasajero canceló el viaje.', 'warn'); return; }
    const doc = snap.docs[0], v = doc.data(), d = AppState.driver;
    const same = !!(cur && cur.id === doc.id);
    const t = {
      id: doc.id, isRealPassenger: false, isRealDriver: true, passengerName: v.passengerName, passengerPhone: v.passengerPhone || '',
      pickup: v.pickup, dropoff: v.dropoff, vehicle: v.vehicle, fare: v.fare, payment: v.payment, distKm: v.distKm || 1, note: v.note || '',
      pin: null, status: v.status, driver: { name: d.name, plate: d.plate, vehicle: d.vehicleType, rating: 5, phone: d.phone, nequi: d.nequiNumber, isReal: true },
      driverPos: { ...AppState.driverPos }, dismissed: { p: true, d: false }
    };
    if (same) { t._leg = cur._leg; t._d0 = cur._d0; }
    const changed = !same || cur.status !== t.status;
    AppState.activeTrip = t; d.activeRequest = null;
    if (changed) { Trip.k = 0; t._d0 = null; this.tickProgress(); AppState.ui.collapsed = false; render({ fit: true }); }
  },

  async driverStep(status, pin) {
    const t = AppState.activeTrip; if (!t) return;
    const data = { status }; if (pin !== undefined) data.pinAttempt = pin;
    try { await this.col('trips').doc(t.id).update(data); }
    catch (e) {
      if (status === 'in_progress') { toast('PIN incorrecto. Pídeselo de nuevo al pasajero.', 'danger'); const i = $('#pin-in'); if (i) { i.classList.add('err'); i.focus(); } }
      else this.err(e);
    }
  },

  async finishTrip() {
    const t = AppState.activeTrip, d = AppState.driver; if (!t || t.status !== 'in_progress') return;
    const tr = this.col('trips').doc(t.id), w = this.col('wallets').doc(this.uid);
    const b = this.db.batch();
    b.update(tr, { status: 'completed', completedAt: this.ts() });
    b.update(w, { balance: this.inc(-d.commissionPerTrip), lastTripId: t.id });
    b.set(w.collection('tx').doc(), { type: 'commission', amount: -d.commissionPerTrip, desc: `Comisión · ${shortAddr(t.pickup.address)} a ${shortAddr(t.dropoff.address)}`, ts: this.ts() });
    t.summary = { fare: t.fare, commission: d.commissionPerTrip, payment: t.payment };
    AppState.history.unshift({ id: t.id, ts: Date.now(), fare: t.fare, payment: t.payment, vehicle: t.vehicle, from: t.pickup.address, to: t.dropoff.address, fromPos: { lat: t.pickup.lat, lng: t.pickup.lng }, toPos: { lat: t.dropoff.lat, lng: t.dropoff.lng }, asDriver: true, asPassenger: false, commission: d.commissionPerTrip });
    Trip.setStatus('completed');
    try { await b.commit(); }
    catch (e) { AppState.history.shift(); t.status = 'in_progress'; Trip.setStatus('in_progress'); this.err(e); }
  },

  async driverCancel() {
    const t = AppState.activeTrip; if (!t) return;
    const tr = this.col('trips').doc(t.id), b = this.db.batch();
    b.update(tr, { status: 'searching', driverId: null, driverInfo: null, driverPos: null });
    b.delete(tr.collection('offers').doc(this.uid));
    try { await b.commit(); this.rejected.add(t.id); this.myOffers.delete(t.id); Trip.reset('Cancelaste la carrera.', 'info'); }
    catch (e) { this.err(e); }
  },

  /* ---------- Recuperar contraseña: automático, el enlace le llega a la persona a su propio correo ---------- */
  async phoneTaken(phone) {
    try { return (await this.col('phoneIndex').doc(phone).get()).exists; } catch (e) { return false; }
  },
  async indexPhone(phone, email, uid) {
    try { await this.col('phoneIndex').doc(phone).set({ email, uid }); } catch (e) { console.warn('No se pudo indexar el celular', e); }
  },
  async ensurePhoneIndex(email, uid, phone) {
    if (!email || !phone) return;
    try { const d = await this.col('phoneIndex').doc(phone).get(); if (!d.exists) await this.col('phoneIndex').doc(phone).set({ email, uid }); } catch (e) { /* sin permiso o sin conexión */ }
  },
  async _reset(email) {
    const base = location.origin + location.pathname.replace(/[^/]*$/, '');
    try { await this.auth.sendPasswordResetEmail(email, { url: base + 'index.html' }); }
    catch (e) {
      if (e && ['auth/unauthorized-continue-uri', 'auth/invalid-continue-uri', 'auth/missing-continue-uri'].includes(e.code)) await this.auth.sendPasswordResetEmail(email);
      else throw e;
    }
  },
  async sendReset(email) {
    email = (email || '').trim().toLowerCase();
    if (/^3\d{9}$/.test(email)) {
      let m = null;
      try { const d = await this.col('phoneIndex').doc(email).get(); m = d.exists ? d.data().email : null; } catch (e0) { m = null; }
      if (!m) { Screens.show('forgot', { sent: true }); return; }
      email = m;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { toast('Escribe tu correo o tu celular.', 'warn'); return; }
    try { await this._reset(email); }
    catch (e) {
      const c = e && e.code;
      if (c === 'auth/too-many-requests') { toast('Demasiados intentos. Espera unos minutos.', 'danger'); return; }
      if (c === 'auth/network-request-failed') { toast('Sin conexión. Intenta de nuevo.', 'danger'); return; }
      console.warn(e);
    }
    Screens.show('forgot', { sent: true });
  },
  changePass() {
    const a = AppState.account; if (!a || !a.email) return;
    this._reset(a.email).then(() => toast('Te enviamos un correo a ' + a.email + ' para cambiar tu contraseña.', 'ok')).catch(e => this.err(e));
  },

  /* ---------- Recargas ---------- */
  async topup() {
    const a = AppState.account, u = AppState.ui;
    try {
      await this.col('topups').add({ driverId: this.uid, name: a.name, phone: a.phone, amount: u.rechargeAmount, status: 'pending', createdAt: this.ts() });
      u.rechargeState = 'pending'; UI.modal();
    } catch (e) { this.err(e); }
  }
};

const Onboard = {
  startPassenger() {
    const a = AppState.account;
    if (a) { AppState.session = true; Store.save(); this.enterApp(); return; }
    Screens.form = { payment: 'cash' }; Screens.show('regPassenger');
  },
  startDriver() {
    const a = AppState.account;
    if (a && a.driver && a.driver.status === 'approved') { AppState.session = true; AppState.currentRole = 'driver'; Store.save(); this.enterApp(); return; }
    if (a && a.driver) { Screens.show('driverPending'); return; }
    Screens.form = { vehicleType: 'moto', name: a ? a.name : '', phone: a ? a.phone : '' };
    Screens.step = 0; Screens.show('regDriver');
  },
  enterApp() {
    Screens.close();
    if (AppState.currentRole === 'driver' && !Account.driverOk()) AppState.currentRole = 'passenger';
    Account.applyDriver();
    if (AppState.me.status === 'idle' && AppState.passenger.pickupMode === 'gps') GPS.start();
    if (Live.on) { Live.startListeners(); Live.startDriverListeners(); }
    render({ fit: true });
  },
  boot() {
    const ref = new URLSearchParams(location.search).get('ref');
    Screens.show('splash');
    const go = () => {
      const a = AppState.account;
      if (a && AppState.session) {
        if (ref === 'driver' && !a.driver) this.startDriver(); else this.enterApp();
      } else if (ref === 'driver') this.startDriver();
      else if (ref === 'passenger' && !a) this.startPassenger();
      else Screens.show('welcome');
    };
    const wait = new Promise(r => setTimeout(r, 1900));
    const auth = Live.ready ? Promise.race([Live.ready, new Promise(r => setTimeout(r, 7000))]) : Promise.resolve();
    Promise.all([wait, auth]).then(go);
  }
};

const Viewport = {
  fix() {
    const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
    const standalone = window.navigator.standalone === true || mq('(display-mode: standalone)') || mq('(display-mode: fullscreen)');
    const portrait = window.innerHeight >= window.innerWidth;
    const sh = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    const vv = window.visualViewport ? window.visualViewport.height : 0;
    let h = Math.max(window.innerHeight, vv, document.documentElement.clientHeight);
    if (standalone) h = Math.max(h, sh);
    if (sh > 0) h = Math.min(h, sh);
    const root = document.documentElement.style;
    root.setProperty('--app-h', Math.round(h) + 'px');
    root.setProperty('--extra', '0px');
    if (MapView.map) MapView.map.invalidateSize();
  },
  init() {
    const go = () => Viewport.fix();
    ['resize', 'orientationchange', 'pageshow', 'load', 'focus'].forEach(ev => window.addEventListener(ev, () => { go(); setTimeout(go, 250); }));
    document.addEventListener('visibilitychange', go);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', go);
    [150, 500, 1200, 2500].forEach(ms => setTimeout(go, ms));
  }
};

function applyBrandIcons() {
  try { $('#fav').href = 'data:image/svg+xml,' + encodeURIComponent(Logo.icon(180)); } catch (e) { /* el ícono es opcional */ }
}

window.addEventListener('DOMContentLoaded', () => {
  Store.load();
  Live.init();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  const paintOnline = () => { $('#offline').hidden = navigator.onLine; };
  window.addEventListener('online', paintOnline); window.addEventListener('offline', paintOnline); paintOnline();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Awake.sync(); });
  AppState.driver.isOnline = false; AppState.passenger.tripStatus = 'idle';
  $('#hdr-logo').innerHTML = `<button class="flex items-center gap-2 tap" data-act="goHome" aria-label="Ir al inicio de TamboGo">${Logo.icon(28, false)}<span class="text-[15px] hidden min-[400px]:inline">${Logo.word()}</span></button>`;
  applyBrandIcons();
  Viewport.fix();
  Viewport.init();
  MapView.init();
  render({ fit: true });
  setTimeout(() => MapView.map.invalidateSize(), 300);
  Onboard.boot();
});
</script>
